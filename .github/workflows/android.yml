name: APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construir el juego
        run: node tools/build.mjs

      - name: Instalar Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Crear el proyecto Android
        working-directory: app
        run: |
          node ../tools/prepare-app.mjs
          npx cap add android
          node ../tools/patch-android.mjs
          npx cap sync android

      - name: Compilar el APK
        working-directory: app/android
        run: |
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk las-seis-coronas.apk
          keytool -printcert -jarfile las-seis-coronas.apk | grep SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: las-seis-coronas-apk
          path: las-seis-coronas.apk

      - name: Publicar la descarga
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Las Seis Coronas · prueba ${{ github.run_number }}
          body: |
            Para instalarlo, abre este enlace desde el móvil Android y descarga **las-seis-coronas.apk**.
            Si el móvil avisa de que es de un origen desconocido, permite instalar aplicaciones desde el navegador.
          files: las-seis-coronas.apk
          make_latest: true
