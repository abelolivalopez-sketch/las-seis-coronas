<title>Las Seis Coronas</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  /* Consola de mano: pantalla 3:2 arriba, cruceta y botones abajo (en horizontal, a los lados) */
  :root {
    --shell: #2a2140;
    --shell-hi: #3a2f57;
    --shell-lo: #16111f;
    --bezel: #0d0a14;
    --ink: #f1e6cd;
    --muted: #9d90b4;
    --gold: #e5b44f;
    --btn: #43375e;
    --btn-hi: #5b4d7c;
    --btn-a: #b6463b;
    --btn-b: #3d6aa1;
    --paper: #fbf4e0;
    --paper-ink: #3c3434;
    --paper-edge: #7a4d26;
    --ui: "Silkscreen", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--shell-lo);
    color: var(--ink);
    font-family: var(--ui);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .console {
    box-sizing: border-box;
    height: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "screen screen screen" "dpad mid ab" "hint hint hint";
    align-items: center;
    column-gap: 12px;
    row-gap: 10px;
    background:
      radial-gradient(120% 60% at 50% 0%, var(--shell-hi) 0%, var(--shell) 55%, var(--shell-lo) 100%);
  }
  .screen-wrap {
    grid-area: screen;
    justify-self: center;
    width: 100%;
    max-width: min(720px, calc((100dvh - 250px) * 1.5));
    position: relative;
    box-sizing: border-box;
    background: var(--bezel);
    border-radius: 14px 14px 34px 14px;
    padding: 10px 10px 8px;
    box-shadow: inset 0 0 0 2px #241c33, 0 6px 0 #0a0710;
  }
  #screen {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    height: auto;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0810;
    border-radius: 3px;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .brand b { color: var(--gold); font-weight: 700; }

  /* cruceta */
  .dpad {
    grid-area: dpad;
    justify-self: start;
    position: relative;
    width: 138px;
    height: 138px;
    touch-action: none;
  }
  .dpad::before, .dpad::after {
    content: "";
    position: absolute;
    background: var(--btn);
    border-radius: 8px;
    box-shadow: 0 4px 0 #120d1b, inset 0 2px 0 var(--btn-hi);
  }
  .dpad::before { left: 46px; top: 4px; width: 46px; height: 130px; }
  .dpad::after { top: 46px; left: 4px; width: 130px; height: 46px; }
  .dpad i {
    position: absolute;
    z-index: 1;
    width: 0; height: 0;
    border: 8px solid transparent;
    opacity: 0.55;
  }
  .dpad .u { left: 61px; top: 16px; border-bottom-color: var(--ink); }
  .dpad .d { left: 61px; bottom: 16px; border-top-color: var(--ink); }
  .dpad .l { top: 61px; left: 16px; border-right-color: var(--ink); }
  .dpad .r { top: 61px; right: 16px; border-left-color: var(--ink); }
  .dpad[data-dir="up"] .u, .dpad[data-dir="down"] .d, .dpad[data-dir="left"] .l, .dpad[data-dir="right"] .r { opacity: 1; }
  .dpad .hub { position: absolute; z-index: 1; left: 59px; top: 59px; width: 20px; height: 20px; border-radius: 50%; background: #352a4c; }

  .mid { grid-area: mid; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pill {
    font: 700 11px/1 var(--ui);
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--btn);
    border: 0;
    border-radius: 999px;
    padding: 9px 16px;
    box-shadow: 0 3px 0 #120d1b, inset 0 1px 0 var(--btn-hi);
    touch-action: none;
    cursor: pointer;
  }
  .ab {
    grid-area: ab;
    justify-self: end;
    position: relative;
    width: 148px;
    height: 120px;
  }
  .btn {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 0;
    font: 700 20px/1 var(--ui);
    color: #fff4e4;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 5px 0 #120d1b, inset 0 3px 0 rgba(255, 255, 255, 0.22);
  }
  .btn.a { right: 0; top: 8px; background: var(--btn-a); }
  .btn.b { left: 0; bottom: 4px; background: var(--btn-b); }
  .btn small { display: block; margin-top: 4px; font-size: 8px; letter-spacing: 0.06em; opacity: 0.85; }
  .btn.on, .pill.on { transform: translateY(3px); box-shadow: 0 2px 0 #120d1b, inset 0 3px 0 rgba(255, 255, 255, 0.12); }
  .btn:focus-visible, .pill:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .hint {
    grid-area: hint;
    margin: 0;
    text-align: center;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-wrap: balance;
  }
  .hint kbd { font: inherit; color: var(--ink); background: var(--btn); padding: 1px 5px; border-radius: 4px; }
  @media (hover: none) and (pointer: coarse) { .hint { display: none; } }

  /* teléfono en horizontal: controles a los lados de la pantalla */
  @media (orientation: landscape) and (max-height: 540px) {
    .console {
      max-width: none;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: 1fr auto;
      grid-template-areas: "dpad screen ab" "dpad mid ab";
      padding-block: 8px;
      row-gap: 6px;
    }
    .screen-wrap { max-width: calc((100dvh - 70px) * 1.5); padding: 6px 6px 4px; border-radius: 10px; }
    .brand { display: none; }
    .hint { display: none; }
    .dpad { justify-self: center; }
    .ab { justify-self: center; }
  }
  @media (max-width: 560px) and (orientation: portrait) {
    .console {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto 1fr auto;
      grid-template-areas: "screen screen" "dpad ab" "mid mid";
      row-gap: 14px;
    }
    .screen-wrap { padding: 8px 8px 6px; border-radius: 12px 12px 28px 12px; }
    .mid { padding-bottom: 8px; }
  }
  @media (max-width: 370px) {
    .dpad { transform: scale(0.88); transform-origin: left center; }
    .ab { transform: scale(0.88); transform-origin: right center; }
  }

  /* nombre del personaje */
  .name-dlg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(13, 10, 20, 0.62);
    border-radius: inherit;
    z-index: 5;
  }
  .name-dlg form {
    display: grid;
    gap: 10px;
    width: min(300px, 86%);
    box-sizing: border-box;
    padding: 16px;
    background: var(--paper);
    color: var(--paper-ink);
    border: 3px solid var(--paper-edge);
    border-radius: 6px;
    box-shadow: 0 0 0 2px var(--gold) inset;
  }
  .name-dlg label { font: 700 13px/1.3 var(--ui); }
  .name-dlg input {
    font: 16px/1.2 var(--ui);
    padding: 8px 10px;
    color: var(--paper-ink);
    background: #fffaf0;
    border: 2px solid var(--paper-edge);
    border-radius: 4px;
    user-select: text;
    -webkit-user-select: text;
  }
  .name-dlg input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .name-dlg button {
    font: 700 13px/1 var(--ui);
    padding: 10px;
    color: #fff4e4;
    background: var(--btn-a);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .name-dlg small { font-size: 10px; color: #7a6a5a; }
  @media (prefers-reduced-motion: reduce) { .btn.on, .pill.on { transform: none; } }
</style>

<script>
(function () {
// ── 00-core.js ──
'use strict';
// ─── Núcleo: constantes, utilidades, reloj de juego, sonido ───────────────
const W = 240, H = 160, T = 16;            // resolución interna estilo GBA y tamaño de casilla
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return [c, x];
}

function hash2(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 7, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function px(ctx, x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }
function rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

// Pinta un dibujo hecho con letras (cada letra es un color de la paleta)
function paintRows(ctx, rows, pal, ox = 0, oy = 0, flip = false) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y], n = r.length;
    for (let x = 0; x < n; x++) {
      const ch = r[x];
      if (ch === '.' || ch === ' ') continue;
      const c = pal[ch];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(ox + (flip ? n - 1 - x : x), oy + y, 1, 1);
    }
  }
}

// ─── Reloj del juego: esperas y animaciones (tweens) ──────────────────────
const Clock = {
  t: 0, timers: [], tweens: [],
  update(dt) {
    this.t += dt;
    for (let i = this.timers.length - 1; i >= 0; i--) {
      const tm = this.timers[i];
      tm.left -= dt;
      if (tm.left <= 0) { this.timers.splice(i, 1); tm.fn(); }
    }
    for (let i = this.tweens.length - 1; i >= 0; i--) {
      const tw = this.tweens[i];
      tw.e += dt;
      const k = Math.min(1, tw.e / tw.d), v = tw.ease(k);
      for (const p in tw.to) tw.o[p] = tw.from[p] + (tw.to[p] - tw.from[p]) * v;
      if (k >= 1) { this.tweens.splice(i, 1); tw.done(); }
    }
  },
};
function wait(ms) { return new Promise(r => Clock.timers.push({ left: ms, fn: r })); }
const Ease = {
  lin: k => k,
  out: k => 1 - (1 - k) * (1 - k),
  in: k => k * k,
  io: k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
};
function tween(o, to, d, ease = Ease.out) {
  return new Promise(r => {
    const from = {};
    for (const p in to) from[p] = o[p];
    Clock.tweens.push({ o, to, from, d: Math.max(1, d), e: 0, ease, done: r });
  });
}

// ─── Sonido: pitidos sintetizados (sin archivos) ──────────────────────────
const Sfx = {
  ctx: null, on: true,
  unlock() {
    // iPhone: el audio solo arranca dentro de un toque y se queda "interrupted" al volver de otra app
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const s = this.ctx.createBufferSource();
      s.buffer = this.ctx.createBuffer(1, 1, 22050);
      s.connect(this.ctx.destination);
      s.start(0);
    } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    const c = this.ctx;
    if (!c || !this.on) return;
    try {
      const t0 = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t0 + d);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g).connect(c.destination);
      o.start(t0); o.stop(t0 + d + 0.03);
    } catch (e) { /* sin sonido */ }
  },
  noise(d, vol = 0.08, delay = 0) {
    const c = this.ctx;
    if (!c || !this.on) return;
    try {
      const len = Math.floor(c.sampleRate * d);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const s = c.createBufferSource(), g = c.createGain();
      s.buffer = buf; g.gain.value = vol;
      s.connect(g).connect(c.destination);
      s.start(c.currentTime + delay);
    } catch (e) { /* sin sonido */ }
  },
  play(n) {
    switch (n) {
      case 'blip': this.tone(1046, 0.04, 'square', 0.035); break;
      case 'select': this.tone(784, 0.05, 'square', 0.04); this.tone(1175, 0.07, 'square', 0.04, 0, 0.05); break;
      case 'back': this.tone(523, 0.06, 'square', 0.04, -120); break;
      case 'bump': this.tone(98, 0.09, 'square', 0.05); break;
      case 'hit': this.noise(0.14, 0.12); this.tone(220, 0.12, 'sawtooth', 0.04, -160); break;
      case 'crit': this.noise(0.22, 0.16); this.tone(330, 0.2, 'sawtooth', 0.05, -260); break;
      case 'miss': this.tone(440, 0.12, 'triangle', 0.05, -200); break;
      case 'buff': [523, 659, 784].forEach((f, i) => this.tone(f, 0.08, 'triangle', 0.06, 0, i * 0.06)); break;
      case 'debuff': [784, 659, 523].forEach((f, i) => this.tone(f, 0.08, 'triangle', 0.06, 0, i * 0.06)); break;
      case 'faint': this.tone(392, 0.5, 'square', 0.045, -300); break;
      case 'heal': [659, 784, 988, 1319].forEach((f, i) => this.tone(f, 0.1, 'triangle', 0.06, 0, i * 0.08)); break;
      case 'item': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.09, 'square', 0.035, 0, i * 0.07)); break;
      case 'level': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.11, 'square', 0.04, 0, i * 0.09)); break;
      case 'encounter': [196, 233, 262, 311, 349, 392].forEach((f, i) => this.tone(f, 0.07, 'sawtooth', 0.035, 0, i * 0.05)); break;
      case 'alert': this.tone(1568, 0.06, 'square', 0.05); this.tone(2093, 0.12, 'square', 0.05, 0, 0.07); break;
      case 'coin': this.tone(1319, 0.05, 'square', 0.04); this.tone(1976, 0.12, 'square', 0.04, 0, 0.05); break;
      case 'win': [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'square', 0.04, 0, i * 0.11)); break;
      case 'door': this.noise(0.08, 0.05); break;
    }
  },
};

// ── 01-input.js ──
// ─── Controles: teclado + cruceta y botones táctiles ──────────────────────
const DIRS = ['up', 'down', 'left', 'right'];
const DV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

const Input = {
  held: {}, pending: new Set(), pressed: new Set(), rep: new Set(), holdT: {}, lastDir: null, locked: false,
  map: {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    KeyZ: 'a', KeyJ: 'a', Enter: 'a', Space: 'a', NumpadEnter: 'a',
    KeyX: 'b', KeyK: 'b', Escape: 'b', Backspace: 'b', ShiftLeft: 'b', ShiftRight: 'b',
    KeyM: 'start', KeyP: 'start', Tab: 'start',
  },
  init() {
    addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const k = this.map[e.code];
      if (!k) return;
      e.preventDefault();
      if (!e.repeat) this.press(k);
    });
    addEventListener('keyup', e => { const k = this.map[e.code]; if (k) this.release(k); });
    addEventListener('blur', () => { for (const k in this.held) this.held[k] = false; });
    // Safari en iPhone solo deja activar el sonido al levantar el dedo o con un clic
    for (const ev of ['touchend', 'click']) document.addEventListener(ev, () => Sfx.unlock(), { passive: true });

    document.querySelectorAll('[data-btn]').forEach(el => {
      const k = el.dataset.btn;
      el.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        this.press(k); el.classList.add('on');
      });
      const up = () => { this.release(k); el.classList.remove('on'); };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('lostpointercapture', up);
      el.addEventListener('contextmenu', e => e.preventDefault());
    });

    const pad = document.getElementById('dpad');
    if (pad) {
      let active = null;
      const setDir = d => {
        if (d === active) return;
        if (active) this.release(active);
        active = d;
        if (d) this.press(d);
        pad.dataset.dir = d || '';
      };
      const fromEvent = e => {
        const r = pad.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(dx, dy) < r.width * 0.1) return active;
        return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
      };
      pad.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { pad.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        setDir(fromEvent(e));
      });
      pad.addEventListener('pointermove', e => { if (active) setDir(fromEvent(e)); });
      const end = () => setDir(null);
      pad.addEventListener('pointerup', end);
      pad.addEventListener('pointercancel', end);
      pad.addEventListener('lostpointercapture', end);
      pad.addEventListener('contextmenu', e => e.preventDefault());
    }
  },
  press(k) {
    if (!this.held[k]) { this.pending.add(k); this.holdT[k] = 0; }
    this.held[k] = true;
    if (DIRS.includes(k)) this.lastDir = k;
    Sfx.unlock();
  },
  release(k) { this.held[k] = false; },
  poll(dt) {
    this.pressed = this.pending;
    this.pending = new Set();
    this.rep = new Set(this.pressed);
    for (const k of DIRS) {
      if (!this.held[k]) continue;
      const prev = this.holdT[k] || 0, now = prev + dt;
      this.holdT[k] = now;
      if (prev < 380 && now >= 380) this.rep.add(k);
      else if (now > 380 && Math.floor((now - 380) / 110) > Math.floor((prev - 380) / 110)) this.rep.add(k);
    }
    if (this.locked) { this.pressed = new Set(); this.rep = new Set(); }
  },
  hit(k) { return this.pressed.has(k); },
  repeat(k) { return this.rep.has(k); },
  down(k) { return !this.locked && !!this.held[k]; },
  clear() { this.pressed = new Set(); this.rep = new Set(); this.pending = new Set(); },
  dir() {
    if (this.locked) return null;
    if (this.lastDir && this.held[this.lastDir]) return this.lastDir;
    for (const k of DIRS) if (this.held[k]) return k;
    return null;
  },
};

const ACCENTS = {
  'á': ['a', 'acute'], 'é': ['e', 'acute'], 'í': ['ı', 'acute'], 'ó': ['o', 'acute'], 'ú': ['u', 'acute'],
  'ñ': ['n', 'tilde'], 'ü': ['u', 'diaer'],

  // francés
  'à': ['a', 'grave'], 'è': ['e', 'grave'], 'ù': ['u', 'grave'],

  // italiano
  'ì': ['ı', 'grave'], 'ò': ['o', 'grave'], 'Ò': ['O', 'grave'], 'Ì': ['I', 'grave'],
  'À': ['A', 'grave'], 'È': ['E', 'grave'], 'Ù': ['U', 'grave'],
  'Â': ['A', 'circ'], 'Ê': ['E', 'circ'], 'Î': ['I', 'circ'], 'Ô': ['O', 'circ'], 'Û': ['U', 'circ'],
  'Ë': ['E', 'diaer'], 'Ï': ['I', 'diaer'], 'Ç': ['C', 'cedil'],
};

const Font = {
  LH: 14,               // alto de línea
  glyphs: {},
  cache: {},
  colors: {
    dark: ['#3c3434', '#d6cbb3'],
    light: ['#fbf7ee', '#4a3a52'],
    gold: ['#f8d458', '#5c3210'],
    red: ['#c8302a', '#efc4b0'],
    grey: ['#8c8478', '#e6dcc6'],
    blue: ['#2c56b4', '#c4d4f2'],
    white: ['#ffffff', '#20182a'],
    ink: ['#2a2030', null],
    dim: ['#a898bc', '#1a1424'],
  },
  init() {
    for (const ch in GLYPHS) {
      const rows = GLYPHS[ch];
      const pts = [];
      let w = 0;
      rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') { pts.push([x, y]); w = Math.max(w, x + 1); } });
      if (ch === ' ') w = 3;
      this.glyphs[ch] = { pts, w: Math.max(w, rows[0].length === 1 ? 1 : w) };
      if (!pts.length && ch !== ' ') this.glyphs[ch].w = rows[0].length;
    }
    this.glyphs[' '] = { pts: [], w: 3 };
    for (const ch in ACCENTS) {
      const [base, kind] = ACCENTS[ch];
      const g = this.glyphs[base];
      const upper = base === base.toUpperCase() && base !== 'ı';
      const r0 = upper ? -2 : -1, r1 = upper ? -1 : 0;
      let pts = g.pts.slice();
      let w = g.w;
      if ((kind === 'circ' || kind === 'diaer') && w < 3) { pts = pts.map(([x, y]) => [x + 1, y]); w = 3; }
      const c = Math.floor((w - 1) / 2);
      if (kind === 'acute') { pts.push([c + 1, r0], [c, r1]); w = Math.max(w, c + 2); }
      else if (kind === 'grave') { pts.push([c, r0], [c + 1, r1]); w = Math.max(w, c + 2); }
      else if (kind === 'circ') {
        if (w === 4) pts.push([1, r0], [2, r0], [0, r1], [3, r1]);
        else pts.push([c, r0], [c - 1, r1], [c + 1, r1]);
      }
      else if (kind === 'tilde') { pts.push([0, r1], [1, r0], [2, r1], [3, r0]); if (w >= 5) pts.push([4, r1]); }
      else if (kind === 'diaer') { const rr = upper ? -2 : 0; pts.push([0, rr], [w - 1, rr]); }
      else if (kind === 'cedil') { pts.push([c + 1, 7], [c, 8]); }
      this.glyphs[ch] = { pts, w };
    }
  },
  glyph(ch) { return this.glyphs[ch] || this.glyphs['?']; },
  canvas(ch, color) {
    const key = color + '|' + ch;
    let c = this.cache[key];
    if (c) return c;
    const g = this.glyph(ch);
    const [fg, sh] = this.colors[color] || this.colors.dark;
    const [cv, x] = mkCanvas(g.w + 1, 14);
    if (sh) for (const [gx, gy] of g.pts) px(x, gx + 1, gy + 3, sh);
    for (const [gx, gy] of g.pts) px(x, gx, gy + 2, fg);
    this.cache[key] = cv;
    return cv;
  },
  width(str) {
    let w = 0;
    for (const ch of str) w += this.glyph(ch).w + 1;
    return Math.max(0, w);
  },
  // y = parte de arriba de la celda (las mayúsculas empiezan en y+2)
  draw(ctx, str, x, y, color = 'dark', scale = 1) {
    let cx = x;
    for (const ch of String(str)) {
      const g = this.glyph(ch);
      if (ch !== ' ') {
        const cv = this.canvas(ch, color);
        if (scale === 1) ctx.drawImage(cv, Math.round(cx), Math.round(y));
        else ctx.drawImage(cv, Math.round(cx), Math.round(y), cv.width * scale, cv.height * scale);
      }
      cx += (g.w + 1) * scale;
    }
    return cx;
  },
  drawRight(ctx, str, xRight, y, color) { this.draw(ctx, str, xRight - this.width(str), y, color); },
  drawCenter(ctx, str, xc, y, color, scale = 1) { this.draw(ctx, str, Math.round(xc - this.width(str) * scale / 2), y, color, scale); },
  wrap(str, maxW) {
    const out = [];
    for (const para of String(str).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (this.width(test) <= maxW || !line) line = test;
        else { out.push(line); line = w; }
      }
      out.push(line);
    }
    return out;
  },
};

function lookPalette(L) {
  const sk = SKIN[L.skin], hr = HAIR[L.hair], cl = CLOTH[L.cloth], hs = HOSE[L.hose || 'light'];
  const bd = HAIR[L.beard || L.hair];
  const wr = CLOTH[L.wrap || 'white'], cp = CLOTH[L.capc || L.cloth];
  return {
    k: OUTLINE, s: sk[0], S: sk[1], r: sk[2],
    h: hr[0], H: hr[1], l: hr[2],
    t: cl[0], T: cl[1], L: cl[2],
    b: '#6b4426', y: '#f2ca52', p: hs[0], P: hs[1], f: '#4c3426',
    g: bd[0], G: bd[1], m: '#4a4038',
    i: '#c8ccd4', I: '#8a909c', j: '#f4f6fa',
    w: wr[0], x: wr[1], c: cp[0], C: cp[1],
  };
}

function composeRows(base, view, legIdx, overKey) {
  const body = SPR[base][view === 'side' ? 's' : view].slice();
  const legSet = LEGS[base][view === 'side' ? 'side' : 'front'];
  let legs = legSet[legIdx === 0 ? 0 : 1];
  if (legIdx === 2 && view !== 'side') legs = legs.map(r => r.split('').reverse().join(''));
  const rows = body.concat(legs);
  const keys = Array.isArray(overKey) ? overKey : overKey ? [overKey] : [];
  for (const key of keys) {
    const ov = OVER[key][view === 'side' ? 's' : view] || {};
    for (const ri in ov) {
      const o = ov[ri], r = rows[ri].split('');
      for (let i = 0; i < o.length; i++) if (o[i] !== '.') r[i] = o[i];
      rows[ri] = r.join('');
    }
  }
  return rows;
}

// Hoja de 12 fotogramas: abajo 0-2, arriba 3-5, izquierda 6-8, derecha 9-11
function buildCharSheet(L) {
  const pal = lookPalette(L);
  const [c, x] = mkCanvas(16 * 12, 24);
  const views = [['d', false], ['u', false], ['side', false], ['side', true]];
  views.forEach(([v, flip], vi) => {
    for (let f = 0; f < 3; f++) {
      const rows = composeRows(L.base, v, f, L.over);
      paintRows(x, rows, pal, (vi * 3 + f) * 16, 0, flip);
    }
  });
  return c;
}

// Silueta con sombreado automático (para árboles, animales…)
function shapeArt(w, h, regions, outline, detail) {
  const [c, x] = mkCanvas(w, h);
  const id = new Int16Array(w * h).fill(-1);
  const inside = (r, X, Y) => {
    if (r.e) { const [cx, cy, rx, ry] = r.e; return ((X - cx) / rx) ** 2 + ((Y - cy) / ry) ** 2 <= 1; }
    if (r.r) { const [x0, y0, x1, y1] = r.r; return X >= x0 && X <= x1 && Y >= y0 && Y <= y1; }
    if (r.p) {
      let ins = false; const P = r.p;
      for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
        if ((P[i][1] > Y) !== (P[j][1] > Y) && X < (P[j][0] - P[i][0]) * (Y - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) ins = !ins;
      }
      return ins;
    }
    return false;
  };
  const center = r => r.e ? [r.e[0], r.e[1], r.e[2], r.e[3]] : r.r ? [(r.r[0] + r.r[2]) / 2, (r.r[1] + r.r[3]) / 2, (r.r[2] - r.r[0]) / 2 + 0.5, (r.r[3] - r.r[1]) / 2 + 0.5]
    : (() => { const xs = r.p.map(p => p[0]), ys = r.p.map(p => p[1]); return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2, (Math.max(...xs) - Math.min(...xs)) / 2 + 0.5, (Math.max(...ys) - Math.min(...ys)) / 2 + 0.5]; })();
  regions.forEach((r, i) => {
    for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) if (inside(r, X + 0.5, Y + 0.5)) id[Y * w + X] = i;
  });
  const at = (X, Y) => (X < 0 || Y < 0 || X >= w || Y >= h ? -1 : id[Y * w + X]);
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
    const i = at(X, Y);
    if (i < 0) {
      if (outline && (at(X - 1, Y) >= 0 || at(X + 1, Y) >= 0 || at(X, Y - 1) >= 0 || at(X, Y + 1) >= 0)) px(x, X, Y, outline);
      continue;
    }
    const r = regions[i], [cx, cy, rx, ry] = center(r);
    const v = -(((X + 0.5 - cx) / rx) * 0.55 + ((Y + 0.5 - cy) / ry) * 0.85);
    let shade = v > (r.lt ?? 0.42) ? 0 : v > (r.dk ?? -0.38) ? 1 : 2;
    if (r.noise && hash2(X, Y, r.noise) < 0.18) shade = Math.max(0, shade - 1);
    if (r.noise && hash2(X, Y, r.noise + 1) < 0.12) shade = Math.min(2, shade + 1);
    px(x, X, Y, r.c[shade]);
    if (r.inner && (at(X, Y - 1) !== i && at(X, Y - 1) >= 0)) px(x, X, Y, r.inner);
  }
  if (detail) detail(x);
  return c;
}

function drawHouse(ctx, ox, oy, wc, hc, o) {
  const Wd = wc * 16, Ht = hc * 16;
  const roofH = 26, wallY = 29;
  const R = o.roof || ['#e98c62', '#c9623e', '#94422a'];
  const OL = '#3e2a22';
  // tejado (de tejas o plano con almenas, al estilo de Marruecos)
  if (o.flat) {
    const F = o.flat === true ? ['#f2cfa0', '#ddb07c', '#b8885a'] : o.flat;
    rect(ctx, ox, oy, Wd, roofH, F[1]);
    for (let k = 0; k < Wd; k += 3) px(ctx, ox + k + (k % 2), oy + 6 + Math.floor(hash2(k, oy, 9) * 16), F[0]);
    rect(ctx, ox, oy + 3, Wd, 2, F[2]);
    for (let x = 1; x < Wd - 3; x += 6) { rect(ctx, ox + x, oy, 4, 3, F[0]); rect(ctx, ox + x, oy - 1, 4, 1, OL); }
    rect(ctx, ox, oy, 1, roofH, OL); rect(ctx, ox + Wd - 1, oy, 1, roofH, OL);
    rect(ctx, ox, oy + roofH, Wd, 2, F[2]); rect(ctx, ox, oy + roofH + 2, Wd, 1, OL);
  } else {
    rect(ctx, ox, oy, Wd, roofH, R[1]);
    for (let y = 3; y < roofH; y++) {
      const course = Math.floor((y - 3) / 5), r = (y - 3) % 5;
      for (let x = 1; x < Wd - 1; x++) {
        let c = R[1];
        if (r === 4) c = R[2];
        else { const ph = (x + (course % 2) * 2) % 4; c = ph === 0 ? R[2] : ph === 1 ? R[0] : R[1]; }
        px(ctx, ox + x, oy + y, c);
      }
    }
    rect(ctx, ox, oy, Wd, 3, R[2]);
    rect(ctx, ox + 1, oy + 1, Wd - 2, 1, R[3] || '#7a3422');
    rect(ctx, ox, oy, Wd, 1, OL); rect(ctx, ox, oy, 1, roofH, OL); rect(ctx, ox + Wd - 1, oy, 1, roofH, OL);
    rect(ctx, ox, oy + roofH, Wd, 2, R[3] || '#6a2c1c'); rect(ctx, ox, oy + roofH + 2, Wd, 1, OL);
  }
  if (o.chimney) {
    const cx = ox + o.chimney * 16 + 4;
    rect(ctx, cx, oy - 2, 7, 9, '#efe8dc'); rect(ctx, cx, oy - 2, 7, 1, OL); rect(ctx, cx, oy - 2, 1, 9, OL); rect(ctx, cx + 6, oy - 2, 1, 9, OL);
    rect(ctx, cx + 1, oy - 1, 5, 1, '#b8ac9c');
  }
  // fachada (encalada por defecto)
  const WL = o.wall || ['#f6f2ea', '#d6cdbf', '#e8e1d4'];
  rect(ctx, ox, oy + wallY, Wd, Ht - wallY, WL[0]);
  rect(ctx, ox, oy + wallY, Wd, 2, WL[1]);
  for (let k = 0; k < Wd; k++) if (hash2(k, oy, 3) < 0.25) px(ctx, ox + k, oy + wallY + 3 + Math.floor(hash2(k, ox, 4) * 22), WL[2]);
  rect(ctx, ox, oy + wallY, 1, Ht - wallY, OL); rect(ctx, ox + Wd - 1, oy + wallY, 1, Ht - wallY, OL);
  rect(ctx, ox + Wd - 2, oy + wallY, 1, Ht - wallY, WL[1]);
  // zócalo

// Color de suelo de una casilla (para las orillas del agua)
function groundCol(ch) {
  if (ch === 's' || ch === 'Q' || ch === 'r') return GP.sand.b;
  if (ch === '=') return GP.dirt.b;
  if (ch === '#') return GP.stone.b;
  if (ch === 'D' || ch === 'X' || ch === 'K') return GP.wood.b;
  if (ch === 'W') return GP.wall.top;
  if (ch === 'M') return GP.rock[1];
  return GP.grass;
}

// Empedrado de calles y plazas
function cobbleTile(ctx, ox, oy, tx, ty) {
  const S = GP.stone;
  rect(ctx, ox, oy, 16, 16, S.m);
  for (let r = 0; r < 4; r++) {
    const gy = ty * 4 + r, off = (gy % 2) * 4, y = oy + r * 4;
    for (let c = -1; c < 3; c++) {
      const lx = c * 8 + off, x0 = Math.max(0, lx), x1 = Math.min(16, lx + 7);
      if (x1 <= x0) continue;
      const id = Math.floor((tx * 16 + lx - off) / 8);
      const v = hash2(id, gy, 3);
      rect(ctx, ox + x0, y, x1 - x0, 3, v < 0.28 ? S.d : v < 0.85 ? S.b : S.l);
      rect(ctx, ox + x0, y, x1 - x0, 1, S.l);
    }
  }
}

// Muralla: las filas de abajo enseñan la cara de piedra; las de arriba, el adarve
function wallTile(ctx, ox, oy, tx, ty, nb) {
  const Wc = GP.wall;
  if (nb.s) {
    rect(ctx, ox, oy, 16, 16, Wc.b);
    for (let r = 0; r < 3; r++) {
      const y = oy + 1 + r * 5, off = ((ty * 3 + r) % 2) * 4;
      rect(ctx, ox, y + 4, 16, 1, Wc.d);
      for (let x = off; x < 16; x += 8) rect(ctx, ox + x, y, 1, 4, Wc.d);
      rect(ctx, ox, y, 16, 1, Wc.l);
    }
    rect(ctx, ox, oy + 15, 16, 1, Wc.ol);
    if (nb.n) {
      rect(ctx, ox, oy, 16, 1, Wc.ol);
      for (let x = 0; x < 16; x += 8) { rect(ctx, ox + x + 1, oy - 3, 5, 3, Wc.l); rect(ctx, ox + x, oy - 4, 7, 1, Wc.ol); rect(ctx, ox + x, oy - 3, 1, 3, Wc.ol); rect(ctx, ox + x + 6, oy - 3, 1, 3, Wc.ol); }
    }
  } else {
    rect(ctx, ox, oy, 16, 16, Wc.top);
    for (let k = 0; k < 5; k++) px(ctx, ox + Math.floor(hash2(tx, ty, k + 300) * 16), oy + Math.floor(hash2(tx, ty, k + 310) * 16), Wc.b);
    if (nb.n) {
      rect(ctx, ox, oy, 16, 1, Wc.ol);
      for (let x = 0; x < 16; x += 8) { rect(ctx, ox + x + 1, oy + 1, 5, 3, Wc.l); rect(ctx, ox + x + 1, oy + 4, 5, 1, Wc.d); }
    }
  }
  if (nb.w) rect(ctx, ox, oy, 1, 16, Wc.ol);
  if (nb.e) rect(ctx, ox + 15, oy, 1, 16, Wc.ol);
}

// Roca de montaña (no se puede pasar)
function cliffTile(ctx, ox, oy, tx, ty, nb) {
  const R = GP.rock;
  rect(ctx, ox, oy, 16, 16, R[1]);
  for (let k = 0; k < 9; k++) {
    const x = ox + Math.floor(hash2(tx, ty, k + 400) * 13), y = oy + Math.floor(hash2(tx, ty, k + 410) * 13);
    const c = hash2(tx, ty, k + 420) < 0.5 ? R[0] : R[2];
    rect(ctx, x, y, 3, 2, c); px(ctx, x + 1, y + 2, R[2]);
  }
  if (nb.s) {
    rect(ctx, ox, oy + 9, 16, 7, R[2]);
    for (let x = 1; x < 16; x += 4) rect(ctx, ox + x + Math.floor(hash2(tx, x, 7) * 2), oy + 10, 1, 5, R[3]);
    rect(ctx, ox, oy + 9, 16, 1, R[0]);
    rect(ctx, ox, oy + 15, 16, 1, R[3]);
  }
  if (nb.n) { rect(ctx, ox, oy, 16, 1, R[3]); rect(ctx, ox, oy + 1, 16, 1, R[0]); }
  if (nb.w) rect(ctx, ox, oy, 1, 16, R[3]);
  if (nb.e) rect(ctx, ox + 15, oy, 1, 16, R[3]);
}

// Tablones de cubierta (barco, muelle, interiores)
function deckTile(ctx, ox, oy, tx, ty) {
  const Wd = GP.wood;
  rect(ctx, ox, oy, 16, 16, Wd.b);
  for (let r = 0; r < 4; r++) {
    const y = oy + r * 4;
    rect(ctx, ox, y + 3, 16, 1, Wd.d);
    rect(ctx, ox, y, 16, 1, Wd.l);
    const j = Math.floor(hash2(tx, ty * 4 + r, 5) * 12) + 2;
    rect(ctx, ox + j, y, 1, 3, Wd.d);
    px(ctx, ox + j + 2, y + 1, Wd.ol); px(ctx, ox + j - 2, y + 1, Wd.ol);
  }
}

// Puente de madera sobre el agua
function bridgeTile(ctx, ox, oy, tx, ty, nb) {
  const Wd = GP.wood;
  rect(ctx, ox, oy, 16, 16, GP.water);
  const vertical = nb.w || nb.e;
  if (vertical) {
    rect(ctx, ox + 1, oy, 14, 16, Wd.b);
    for (let y = 0; y < 16; y += 4) { rect(ctx, ox + 1, oy + y + 3, 14, 1, Wd.d); rect(ctx, ox + 1, oy + y, 14, 1, Wd.l); }
    if (nb.w) { rect(ctx, ox, oy, 2, 16, Wd.ol); rect(ctx, ox + 1, oy, 1, 16, Wd.d); }
    if (nb.e) { rect(ctx, ox + 14, oy, 2, 16, Wd.ol); rect(ctx, ox + 14, oy, 1, 16, Wd.d); }
  } else {
    rect(ctx, ox, oy + 1, 16, 14, Wd.b);
    for (let x = 0; x < 16; x += 4) { rect(ctx, ox + x + 3, oy + 1, 1, 14, Wd.d); rect(ctx, ox + x, oy + 1, 1, 14, Wd.l); }
    if (nb.n) { rect(ctx, ox, oy, 16, 2, Wd.ol); }
    if (nb.s) { rect(ctx, ox, oy + 14, 16, 2, Wd.ol); }
  }
}

function drawPalm(ctx, ox, oy, seed = 0) {
  const lean = hash2(seed, 1, 3) < 0.5 ? -1 : 1;
  for (let y = 27; y < 32; y++) for (let x = 6; x < 26; x++) if (((x - 16) / 9) ** 2 + ((y - 29.5) / 2) ** 2 <= 1) px(ctx, ox - 8 + x, oy - 16 + y, 'rgba(40,40,10,0.22)');
  const leaf = ['#6cb850', '#4a9038', '#2f6a2a'];
  const tx = 16 + lean * 2;
  const art = shapeArt(32, 32, [
    { p: [[15, 30], [18, 30], [17 + lean * 2, 8], [15 + lean * 2, 8]], c: ['#c09868', '#94704a', '#6a4e34'], lt: 0.1 },
    { p: [[tx, 8], [tx - 13, 9], [tx - 15, 13], [tx - 6, 10]], c: leaf },
    { p: [[tx, 8], [tx + 13, 9], [tx + 15, 13], [tx + 6, 10]], c: leaf },
    { p: [[tx, 7], [tx - 10, 1], [tx - 13, 3], [tx - 3, 9]], c: leaf },
    { p: [[tx, 7], [tx + 10, 1], [tx + 13, 3], [tx + 3, 9]], c: leaf },
    { p: [[tx, 7], [tx - 2, 0], [tx + 2, 0], [tx + 1, 8]], c: leaf },
    { e: [tx - 1, 10, 1.6, 1.6], c: ['#8c6a3a', '#6a4c26', '#4a3218'] },
    { e: [tx + 2, 10.5, 1.6, 1.6], c: ['#8c6a3a', '#6a4c26', '#4a3218'] },
  ], '#203018', x => { for (let y = 12; y < 30; y += 3) rect(x, 15 + Math.round(lean * (30 - y) / 11), y, 3, 1, '#6a4e34'); });
  ctx.drawImage(art, ox - 8, oy - 16);
}

// ─── Edificios y objetos grandes ──────────────────────────────────────────
const STONE = {
  claro: ['#ece0c6', '#cdbb96', '#a28c66'],
  gris: ['#d8d4cc', '#b0aaa0', '#847e74'],
  ocre: ['#f0c896', '#d4a06c', '#a8744a'],
  rojo: ['#e09a76', '#c0704e', '#8c4a32'],
};
const OLB = '#3e3026';

function drawColiseo(ctx, ox, oy, wc, hc, o) {
  const Wd = wc * 16, Ht = hc * 16, S = o.stone || STONE.claro, col = o.color || '#c23a3a';
  // cuerpo con laterales más oscuros (parece curvo)
  rect(ctx, ox, oy + 8, Wd, Ht - 8, S[1]);
  for (let x = 0; x < Wd; x++) {
    const k = Math.abs(x - Wd / 2) / (Wd / 2);
    if (k > 0.78) rect(ctx, ox + x, oy + 8, 1, Ht - 8, S[2]);
    else if (k < 0.45) rect(ctx, ox + x, oy + 10, 1, Ht - 12, S[0]);
  }
  rect(ctx, ox, oy + 8, Wd, 1, OLB); rect(ctx, ox, oy + 8, 1, Ht - 8, OLB); rect(ctx, ox + Wd - 1, oy + 8, 1, Ht - 8, OLB);
  rect(ctx, ox + 1, oy + 9, Wd - 2, 3, S[0]); rect(ctx, ox + 1, oy + 12, Wd - 2, 1, S[2]);
  // estandartes en lo alto
  for (let x = 10; x < Wd - 6; x += 22) {
    rect(ctx, ox + x, oy - 4, 1, 13, OLB);
    paintRows(ctx, ['ccccc', 'cccc.', 'ccc..', 'cc...'], { c: col }, ox + x + 1, oy - 4);
  }
  // dos pisos de arcos
  const arches = (y, aw, ah, step) => {
    for (let x = 6; x + aw < Wd - 4; x += step) {
      rect(ctx, ox + x - 1, oy + y - 1, aw + 2, ah + 2, S[2]);
      rect(ctx, ox + x, oy + y + 3, aw, ah - 3, '#3a2e3e');
      rect(ctx, ox + x + 1, oy + y + 1, aw - 2, 2, '#3a2e3e'); rect(ctx, ox + x + 2, oy + y, aw - 4, 1, '#3a2e3e');
      rect(ctx, ox + x, oy + y + ah - 1, aw, 1, S[2]);
    }
  };
  arches(15, 8, 11, 14);
  rect(ctx, ox + 1, oy + 29, Wd - 2, 2, S[2]); rect(ctx, ox + 1, oy + 28, Wd - 2, 1, S[0]);
  arches(34, 10, 14, 16);
  // puerta principal
  const gx = ox + Wd / 2 - 13, gy = oy + Ht - 30;
  rect(ctx, gx - 2, gy - 2, 30, 32, S[2]);
  rect(ctx, gx, gy + 4, 26, 26, '#241a26');
  rect(ctx, gx + 3, gy, 20, 4, '#241a26'); rect(ctx, gx + 1, gy + 2, 24, 2, '#241a26');
  for (let x = 4; x < 26; x += 5) rect(ctx, gx + x, gy + 3, 1, 27, '#6a6470');
  for (let y = 9; y < 30; y += 6) rect(ctx, gx + 1, gy + y, 24, 1, '#6a6470');
  paintRows(ctx, ['kkkkkkkkk', 'kcccccccck', 'kccyyycck', 'kcccycccck', '.kcccccck.', '..kccck..', '...kck...'].map(r => r.slice(0, 9)), { k: OLB, c: col, y: '#f2ca52' }, gx + 8, gy - 12);
  rect(ctx, ox, oy + Ht - 4, Wd, 4, S[2]); rect(ctx, ox, oy + Ht - 1, Wd, 1, OLB);
}

function drawGate(ctx, ox, oy, wc, hc, o) {
  const Wd = wc * 16, Ht = hc * 16, S = o.stone || STONE.claro;
  const tower = (x, w) => {
    rect(ctx, ox + x, oy + 4, w, Ht - 4, S[1]);
    rect(ctx, ox + x, oy + 4, w, 1, OLB); rect(ctx, ox + x, oy + 4, 1, Ht - 4, OLB); rect(ctx, ox + x + w - 1, oy + 4, 1, Ht - 4, OLB);
    for (let cx = x; cx < x + w - 2; cx += 5) { rect(ctx, ox + cx, oy, 4, 4, S[0]); rect(ctx, ox + cx, oy - 1, 4, 1, OLB); }
    for (let y = 10; y < Ht - 4; y += 6) rect(ctx, ox + x + 1, oy + y, w - 2, 1, S[2]);
    rect(ctx, ox + x + w / 2 - 1, oy + 14, 2, 6, '#2a2230');
    rect(ctx, ox + x + 1, oy + 5, 1, Ht - 6, S[0]);
  };
  rect(ctx, ox + 12, oy + 14, Wd - 24, Ht - 14, S[1]);
  rect(ctx, ox + 12, oy + 14, Wd - 24, 1, OLB);
  for (let cx = 14; cx < Wd - 14; cx += 6) { rect(ctx, ox + cx, oy + 10, 4, 4, S[0]); rect(ctx, ox + cx, oy + 9, 4, 1, OLB); }
  for (let y = 20; y < Ht - 2; y += 6) rect(ctx, ox + 13, oy + y, Wd - 26, 1, S[2]);
  tower(0, 18); tower(Wd - 18, 18);
  const dw = 20, dx = ox + Wd / 2 - dw / 2, dy = oy + Ht - 26;
  rect(ctx, dx - 2, dy - 2, dw + 4, 28, S[2]);
  rect(ctx, dx, dy + 4, dw, 22, '#241a26'); rect(ctx, dx + 3, dy, dw - 6, 4, '#241a26'); rect(ctx, dx + 1, dy + 2, dw - 2, 2, '#241a26');
  if (o.portcullis) for (let x = 3; x < dw; x += 4) rect(ctx, dx + x, dy + 2, 1, 14, '#6a6470');
  if (o.color) { rect(ctx, ox + 5, oy + 22, 8, 12, o.color); rect(ctx, ox + Wd - 13, oy + 22, 8, 12, o.color); }
  rect(ctx, ox, oy + Ht - 1, Wd, 1, OLB);
}

function drawShip(ctx, ox, oy, wc, hc, o) {
  const Wd = wc * 16, sail = o.color || '#f4ecd8', flip = !!o.flip;
  const [c, x] = mkCanvas(Wd, hc * 16 + 40);
  const by = 40;
  // casco
  const hull = [[4, by + 10], [Wd - 16, by + 10], [Wd - 2, by + 4], [Wd - 10, by + 30], [12, by + 30], [2, by + 18]];
  const art = shapeArt(Wd, hc * 16 + 40, [
    { p: hull, c: ['#a86c3c', '#7c4c28', '#56331a'], lt: 0.6 },
    { r: [6, by + 2, 22, by + 11], c: ['#b87c48', '#8c5a32', '#643e20'] },
  ], '#2a1a10');
  x.drawImage(art, 0, 0);
  rect(x, 6, by + 15, Wd - 18, 2, '#e2b84a'); rect(x, 8, by + 21, Wd - 22, 1, '#56331a');
  for (let k = 20; k < Wd - 20; k += 12) rect(x, k, by + 17, 3, 3, '#2a1a10');
  // mástil y vela
  const mx = Math.floor(Wd / 2);
  rect(x, mx - 1, 2, 3, by + 9, '#4a2e18'); rect(x, mx, 2, 1, by + 9, '#8c5a32');
  rect(x, mx - 18, 8, 36, 1, '#4a2e18');
  rect(x, mx - 16, 9, 32, 24, '#3a2a20');
  rect(x, mx - 15, 9, 30, 23, sail);
  rect(x, mx - 15, 9, 30, 2, '#ffffff');
  for (let y = 14; y < 32; y += 6) rect(x, mx - 15, y, 30, 1, 'rgba(0,0,0,0.08)');
  if (o.mark) { rect(x, mx - 2, 13, 4, 16, o.mark); rect(x, mx - 8, 19, 16, 4, o.mark); }
  paintRows(x, ['kfff', 'kff.', 'kf..'], { k: '#4a2e18', f: o.flag || '#c23a3a' }, mx, 0);
  // espuma en la línea de flotación
  for (let k = 4; k < Wd - 4; k += 3) px(x, k, by + 31, '#e6f2fc');
  ctx.save();
  if (flip) { ctx.translate(ox * 2 + Wd, 0); ctx.scale(-1, 1); }
  ctx.drawImage(c, ox, oy - 40);
  ctx.restore();
}

function drawStall(ctx, ox, oy, o) {
  const col = o.color || '#c23a3a', OL = '#3a2414';
  rect(ctx, ox + 2, oy + 8, 2, 22, OL); rect(ctx, ox + 28, oy + 8, 2, 22, OL);
  for (let x = 0; x < 32; x++) {
    const c = Math.floor(x / 4) % 2 ? '#f6eedc' : col;
    rect(ctx, ox + x, oy + 2, 1, 9, c);
    if ((x % 4) < 2) px(ctx, ox + x, oy + 11, c);
  }
  rect(ctx, ox, oy + 1, 32, 1, OL); rect(ctx, ox, oy + 2, 1, 9, OL); rect(ctx, ox + 31, oy + 2, 1, 9, OL);
  rect(ctx, ox + 1, oy + 18, 30, 11, OL);
  rect(ctx, ox + 2, oy + 19, 28, 9, '#b07a46'); rect(ctx, ox + 2, oy + 19, 28, 2, '#d0a06a');
  const goods = o.goods || ['#e8a030', '#c23a3a', '#7ab040', '#f2d060'];
  for (let i = 0; i < 6; i++) {

    rect(ctx, gx, oy + 15, 4, 4, OL); rect(ctx, gx + 1, oy + 15, 2, 3, gc); px(ctx, gx + 1, oy + 15, '#ffffff');
  }
  rect(ctx, ox + 2, oy + 30, 28, 2, 'rgba(40,30,10,0.25)');
}

function drawWindmill(ctx, ox, oy) {
  const OL = '#3a3030';
  for (let y = 18; y < 46; y++) {
    const half = 6 + Math.floor((y - 18) / 7);
    rect(ctx, ox + 16 - half, oy + y, half * 2, 1, y % 9 === 0 ? '#e2dcd2' : '#f6f2ea');
    px(ctx, ox + 16 - half, oy + y, OL); px(ctx, ox + 16 + half - 1, oy + y, OL);
    px(ctx, ox + 16 + half - 2, oy + y, '#d6cec0');
  }
  rect(ctx, ox + 6, oy + 46, 20, 1, OL);
  rect(ctx, ox + 13, oy + 36, 6, 10, '#6a4428'); rect(ctx, ox + 13, oy + 35, 6, 1, OL);
  rect(ctx, ox + 15, oy + 25, 3, 4, '#2e2a3a');
  for (let y = 8; y < 19; y++) { const half = Math.max(1, Math.floor((y - 7) * 0.75) + 1); rect(ctx, ox + 16 - half, oy + y, half * 2, 1, y < 12 ? '#8a5040' : '#6a3a2e'); }
  rect(ctx, ox + 8, oy + 18, 16, 1, OL);
  const cx = ox + 16, cy = oy + 14;
  for (const [dx, dy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {
    for (let i = 2; i < 15; i++) {
      px(ctx, cx + dx * i, cy + dy * i, '#5a4030');
      if (i > 4) { px(ctx, cx + dx * i + dx, cy + dy * i, '#efe4cc'); px(ctx, cx + dx * i, cy + dy * i + dy, '#d8ccb2'); }
    }
  }
  rect(ctx, cx - 1, cy - 1, 3, 3, '#3a2a20');
}

}

function drawTower(ctx, ox, oy, wc, hc, o) {
  const Wd = wc * 16, Ht = hc * 16, S = o.stone || STONE.claro;
  const top = o.roof ? 12 : 4;
  rect(ctx, ox + 2, oy + top, Wd - 4, Ht - top, S[1]);
  rect(ctx, ox + 2, oy + top, 3, Ht - top, S[0]); rect(ctx, ox + Wd - 6, oy + top, 4, Ht - top, S[2]);
  rect(ctx, ox + 2, oy + top, 1, Ht - top, OLB); rect(ctx, ox + Wd - 3, oy + top, 1, Ht - top, OLB);
  for (let y = top + 8; y < Ht - 2; y += 8) rect(ctx, ox + 3, oy + y, Wd - 6, 1, S[2]);
  if (o.roof) {
    for (let y = 0; y < 13; y++) { const half = Math.floor(y * (Wd / 2) / 13) + 1; rect(ctx, ox + Wd / 2 - half, oy + y, half * 2, 1, y % 3 ? o.roof[1] : o.roof[2]); }
    rect(ctx, ox + 1, oy + 12, Wd - 2, 1, OLB);
  } else {
    for (let cx = 2; cx < Wd - 3; cx += 6) { rect(ctx, ox + cx, oy, 4, 4, S[0]); rect(ctx, ox + cx, oy - 1, 4, 1, OLB); rect(ctx, ox + cx, oy, 1, 4, OLB); }
  }
  const win = (y, big) => {
    const w = big ? 8 : 3, h = big ? 10 : 6, x = ox + Wd / 2 - w / 2;
    rect(ctx, x, oy + y + 2, w, h - 2, '#2a2230'); rect(ctx, x + 1, oy + y, w - 2, 2, '#2a2230');
  };
  if (o.style === 'campanile') { win(top + 4, true); win(top + 22, false); win(top + 36, false); }
  else { win(top + 6, false); win(top + 20, false); if (Ht > 56) win(top + 36, false); }
  if (o.color) { rect(ctx, ox + Wd / 2 - 1, oy - 10 + (o.roof ? 0 : 0), 1, 10, OLB); paintRows(ctx, ['cccc', 'ccc.', 'cc..'], { c: o.color }, ox + Wd / 2, oy - 10); }
  rect(ctx, ox + 2, oy + Ht - 1, Wd - 4, 1, OLB);
}

function drawDome(ctx, ox, oy) {

  for (let x = 10; x < Wd - 10; x += 10) { rect(ctx, ox + x, oy + 53, 5, 8, '#2a2230'); rect(ctx, ox + x + 1, oy + 52, 3, 1, '#2a2230'); }

  rect(ctx, ox + 30, oy - 4, 4, 6, '#f6f0e4'); rect(ctx, ox + 31, oy - 8, 2, 4, '#d8b04a');
}

function drawGondola(ctx, ox, oy) {

const equipBonus = (id, k) => (id && EQUIP[id] ? EQUIP[id][k] || 0 : 0);
function effStats() {
  const p = P(), e = S0().equip || {};
  return {
    atk: p.atk + equipBonus(e.arma, 'atk') + equipBonus(e.armadura, 'atk'),
    def: p.def + equipBonus(e.arma, 'def') + equipBonus(e.armadura, 'def'),
    spd: p.spd,
  };
}

// Recompensas por caminar (propuesta inicial, se ajustará tras las pruebas)
const WALK = { ducadosPerKm: 50, hogazaEvery: 2, unguentoEvery: 5, stepsPerKm: 1350, maxKmPerDay: 15 };

const statOf = (base, L) => Math.floor((2 * base + 15) * L / 100) + 5;
const hpOf = (base, L) => Math.floor((2 * base + 15) * L / 100) + L + 10;
const xpFor = L => L * L * L;                      // experiencia total para llegar al nivel L
const stageMul = s => (s >= 0 ? (2 + s) / 2 : 2 / (2 - s));

function calcStats(base, L) {
  return { maxHp: hpOf(base.hp, L), atk: statOf(base.atk, L), def: statOf(base.def, L), spd: statOf(base.spd, L) };
}

// Las técnicas del enemigo: las 4 últimas que haya aprendido a su nivel
function foeMoves(list, level) {
  const avail = list.map(m => (Array.isArray(m) ? m : [m, 1])).filter(([, lv]) => lv <= level).map(([id]) => id);
  return avail.slice(-4);
}

function makeFoe(id, level, overrides = {}) {
  const f = FOES[id];
  const st = calcStats(f.base, level);
  const moves = foeMoves(f.moves, level).map(m => ({ id: m, pp: MOVES[m].pp }));
  return Object.assign({ id, name: tr(f.name), art: f.art, level, hp: st.maxHp, ...st, moves, st: { atk: 0, def: 0, spd: 0 }, exp: f.exp, wild: !!f.wild }, overrides);
}

function newState(name, gender, skin) {
  const L = 3;
  const p = { name, gender, skin, level: L, xp: xpFor(L), ...calcStats(PLAYER_BASE, L), moves: [] };
  p.hp = p.maxHp;
  for (const lv in LEARN) if (Number(lv) <= L) for (const m of LEARN[lv]) p.moves.push({ id: m, pp: MOVES[m].pp });
  return {
    v: 1, player: p, ducados: 100, items: { hogaza: 0, unguento: 0 }, flags: {},
    map: 'villaolivo', x: 5, y: 17, dir: 'down',
    km: 0, kmClaimed: 0, steps: 0, blasones: 0, wins: 0,
    walk: { boot: 0, last: -1, total: 0, day: '', dayKm: 0 },
    equip: { arma: 'espada_corta', armadura: null },
    respawn: null,
  };
}
// Partidas guardadas con versiones anteriores
function migrateState(s) {
  if (!s.walk) s.walk = { boot: 0, last: -1, total: 0, day: '', dayKm: 0 };
  if (!s.equip) s.equip = { arma: 'espada_corta', armadura: null };
  if (s.respawn === undefined) s.respawn = null;
  if (!s.items) s.items = {};
  if (s.blasones === undefined) s.blasones = 0;
  if (s.map && !MAPS[s.map]) { s.map = 'villaolivo'; s.x = 5; s.y = 17; s.dir = 'down'; }
  return s;
}

const TOKENS = {
  es: { esc: ['escudero', 'escudera'], Esc: ['Escudero', 'Escudera'], ESC: ['ESCUDERO', 'ESCUDERA'], o: ['o', 'a'], e: ['', ''], cab: ['caballero', 'caballero'], el: ['el', 'la'], El: ['El', 'La'], un: ['un', 'una'], CAB: ['CABALLERO', 'CABALLERA'], Cab: ['Caballero', 'Caballera'], TUEUR: ['MATAGIGANTES', 'MATAGIGANTES'], Tueur: ['Matagigantes', 'Matagigantes'] },
  fr: { esc: ['écuyer', 'écuyère'], Esc: ['Écuyer', 'Écuyère'], ESC: ['ÉCUYER', 'ÉCUYÈRE'], o: ['', 'e'], e: ['', 'e'], cab: ['chevalier', 'chevalière'], el: ['le', 'la'], El: ['Le', 'La'], un: ['un', 'une'], CAB: ['CHEVALIER', 'CHEVALIÈRE'], Cab: ['Chevalier', 'Chevalière'], TUEUR: ['TUEUR', 'TUEUSE'], Tueur: ['Tueur', 'Tueuse'] },
};
function fmt(text) {
  let s = tr(text);
  const st = Game.state;
  if (!st) return s;
  const p = st.player, g = p.gender === 'f' ? 1 : 0;
  const tok = TOKENS[Lang.cur] || TOKENS.es;
  s = s.replace(/\{name\}/g, p.name).replace(/\{NAME\}/g, p.name.toUpperCase())
    .replace(/\{rival\}/g, rivalName()).replace(/\{RIVAL\}/g, rivalName().toUpperCase());
  for (const k in tok) s = s.split('{' + k + '}').join(tok[k][g]);
  return s;
}

function healPlayer() {
  const p = P();
  p.hp = p.maxHp;
  for (const m of p.moves) m.pp = MOVES[m.id].pp;
}

// Sube de nivel y devuelve los cambios (para mostrarlos)
function gainXp(amount) {
  const p = P();
  const events = [];
  if (p.level >= MAX_LV) return events;
  p.xp += amount;
  while (p.level < MAX_LV && p.xp >= xpFor(p.level + 1)) {
    const before = { maxHp: p.maxHp, atk: p.atk, def: p.def, spd: p.spd };
    p.level++;
    const st = calcStats(PLAYER_BASE, p.level);
    p.hp += st.maxHp - p.maxHp;
    Object.assign(p, st);
    const learned = [];
    for (const m of LEARN[p.level] || []) {
      if (p.moves.find(x => x.id === m)) continue;
      if (p.moves.length < 4) { p.moves.push({ id: m, pp: MOVES[m].pp }); learned.push({ m }); }
      else learned.push({ m, full: true });     // el combate pregunta qué técnica olvidar
    }
    events.push({ level: p.level, gains: { maxHp: p.maxHp - before.maxHp, atk: p.atk - before.atk, def: p.def - before.def, spd: p.spd - before.spd }, learned });
  }
  if (p.level >= MAX_LV) p.xp = xpFor(MAX_LV);
  return events;
}

// ─── Interfaz: cuadros de texto, menús de elección, paneles ───────────────
class Widget {
  constructor() { this.done = false; this.result = undefined; this.promise = new Promise(r => (this.resolve = r)); }
  update() {}
  draw() {}
}

class TextWidget extends Widget {
  constructor(text, o = {}) {
    super();
    this.o = Object.assign({ x: 0, y: 112, w: 240, h: 48, perPage: 2, auto: 0, hold: false, color: 'dark', style: 'parch', center: false }, o);
    this.lines = Font.wrap(text, this.o.w - 22);
    this.page = 0; this.shown = 0; this.wait = 0; this.t = 0; this.typedDone = false;
    this.typed = new Promise(r => (this.onTyped = r));
  }
  pageLines() { const n = this.o.perPage; return this.lines.slice(this.page * n, this.page * n + n); }
  isLast() { return (this.page + 1) * this.o.perPage >= this.lines.length; }
  update(dt) {
    this.t += dt;
    const total = this.pageLines().join('').length;
    if (this.shown < total) {
      const fast = Input.down('a') || Input.down('b');
      this.shown = Math.min(total, this.shown + dt * (fast ? 0.16 : 0.05));
      if (Input.hit('a') && this.t > 120) this.shown = total;
      if (this.shown >= total) { this.t = 0; if (this.isLast()) { this.typedDone = true; this.onTyped(); } }
      return;
    }
    if (this.isLast()) {
      if (!this.typedDone) { this.typedDone = true; this.onTyped(); }
      if (this.o.hold) return;
      if (this.o.auto) {
        this.wait += dt;
        if (this.wait >= this.o.auto || Input.hit('a') || Input.hit('b')) this.done = true;
        return;
      }
      if (Input.hit('a') || Input.hit('b')) { Sfx.play('blip'); this.done = true; }
    } else if (Input.hit('a') || Input.hit('b')) {
      Sfx.play('blip'); this.page++; this.shown = 0; this.t = 0;
    }
  }
  draw(ctx) {
    const { x, y, w, h, style, color } = this.o;
    if (style !== 'none') drawBox(ctx, x, y, w, h, style);
    let left = Math.floor(this.shown);
    const lines = this.pageLines();
    lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left));
      left -= ln.length;
      const ty = y + 7 + i * Font.LH;
      if (this.o.center) Font.drawCenter(ctx, part, x + w / 2, ty, color);
      else Font.draw(ctx, part, x + 11, ty, color);
    });
    const total = lines.join('').length;
    if (this.shown >= total && !this.o.hold && !this.o.auto && Math.floor(Clock.t / 300) % 2 === 0) {
      drawDownArrow(ctx, x + w - 17, y + h - 12, color === 'light' ? '#f8d458' : '#c23a3a');
    }
  }
}

class ChoiceWidget extends Widget {
  constructor(options, o = {}) {
    super();
    this.opts = options;
    const w = Math.max(...options.map(s => Font.width(s))) + 26;
    const h = options.length * 14 + 12;
    this.o = Object.assign({ w, h, cancel: options.length - 1, idx: 0 }, o);
    if (this.o.x === undefined) this.o.x = 240 - this.o.w - 2;
    if (this.o.y === undefined) this.o.y = 112 - this.o.h - 1;
    this.idx = this.o.idx;
  }
  update() {
    const n = this.opts.length;
    if (Input.repeat('up')) { this.idx = (this.idx + n - 1) % n; Sfx.play('blip'); }
    if (Input.repeat('down')) { this.idx = (this.idx + 1) % n; Sfx.play('blip'); }
    if (Input.hit('a')) { Sfx.play('select'); this.result = this.idx; this.done = true; }
    else if (Input.hit('b') && this.o.cancel !== null) { Sfx.play('back'); this.result = this.o.cancel; this.done = true; }
  }
  draw(ctx) {
    const { x, y, w, h } = this.o;
    drawBox(ctx, x, y, w, h);
    this.opts.forEach((s, i) => {
      const ty = y + 6 + i * 14;
      Font.draw(ctx, s, x + 16, ty, 'dark');
      if (i === this.idx) drawCursor(ctx, x + 8, ty + 3);
    });
  }
}

// Panel libre: draw(ctx) dibuja, step(dt) devuelve un resultado (≠ undefined) para cerrarse
class PanelWidget extends Widget {
  constructor(draw, step) { super(); this.drawFn = draw; this.stepFn = step; }
  update(dt) { const r = this.stepFn ? this.stepFn(dt, this) : ((Input.hit('a') || Input.hit('b')) ? true : undefined); if (r !== undefined) { this.result = r; this.done = true; } }
  draw(ctx) { this.drawFn(ctx, this); }
}

class UI {
  constructor() { this.stack = []; }
  get busy() { return this.stack.length > 0; }
  push(w) { this.stack.push(w); return w.promise; }
  remove(w) { const i = this.stack.indexOf(w); if (i >= 0) this.stack.splice(i, 1); w.resolve(w.result); }
  update(dt) {
    const top = this.stack[this.stack.length - 1];
    if (!top) return;
    top.update(dt);
    if (top.done) { this.stack.splice(this.stack.indexOf(top), 1); top.resolve(top.result); }
  }
  draw(ctx) { for (const w of this.stack) w.draw(ctx); }
  say(text, o) { return this.push(new TextWidget(fmt(text), o)); }
  async sayAll(list, o) { for (const t of list) await this.say(t, o); }
  choose(options, o) { return this.push(new ChoiceWidget(options, o)); }
  async ask(text, options = ['SÍ', 'NO'], o = {}) {
    const tw = new TextWidget(fmt(text), Object.assign({ hold: true }, o.text || {}));
    this.stack.push(tw);
    await tw.typed;
    const r = await this.choose(options, o.choice || {});
    this.remove(tw);
    return r;
  }
  panel(draw, step) { return this.push(new PanelWidget(draw, step)); }
}

const Game = {
  scene: null, state: null, fadeA: 0, flashA: 0, bars: 0,
  set(scene) { this.scene = scene; if (scene.enter) scene.enter(); },
  update(dt) { if (this.scene) this.scene.update(dt); },
  draw(ctx) {
    if (this.scene) this.scene.draw(ctx);
    if (this.bars > 0) {
      ctx.fillStyle = '#0a0810';
      for (let i = 0; i < 8; i++) {
        const w = Math.round(W * this.bars);
        ctx.fillRect(i % 2 ? W - w : 0, i * 20, w, 20);
      }
    }
    if (this.flashA > 0) { ctx.fillStyle = `rgba(255,255,255,${this.flashA})`; ctx.fillRect(0, 0, W, H); }
    if (this.fadeA > 0) { ctx.fillStyle = `rgba(10,8,16,${this.fadeA})`; ctx.fillRect(0, 0, W, H); }
  },
  fadeOut(ms = 250) { return tween(this, { fadeA: 1 }, ms, Ease.lin); },
  fadeIn(ms = 250) { return tween(this, { fadeA: 0 }, ms, Ease.lin); },
  async battleTransition() {
    Sfx.play('encounter');
    for (let i = 0; i < 3; i++) { this.flashA = 0.85; await tween(this, { flashA: 0 }, 110, Ease.lin); await wait(30); }
    this.bars = 0;
    await tween(this, { bars: 1 }, 420, Ease.in);
    this.fadeA = 1; this.bars = 0;
  },
  async battle(spec) {
    await this.battleTransition();
    const prev = this.scene;
    const b = new BattleScene(spec);
    this.set(b);
    await this.fadeIn(220);
    const res = await b.done;
    await this.fadeOut(320);
    this.set(prev);
    if (!(res === 'lose' && !spec.canLose)) await this.fadeIn(300);
    return res;
  },
  save() { if (this.state) return Save.write(this.state); return false; },
};

        const h = 26 + Math.round(Math.abs(Math.sin(X / 29)) * 14 + Math.sin(X / 7) * 2);
        rect(x, X, h, 1, 60 - h, fc);
        if (h < 32) px(x, X, h, '#f4f6fa');
      }
    } else if (type === 'sea') {
      rect(x, 0, 40, W, 22, fc);
      for (let y = 42; y < 60; y += 4) for (let X = (y * 7) % 13; X < W; X += 19) rect(x, X, y, 5, 1, '#b8dcf6');
    } else if (type === 'walls') {
      rect(x, 0, 30, W, 30, fc);
      for (let X = 0; X < W; X += 10) rect(x, X, 26, 6, 4, fc);
      for (let y = 34; y < 60; y += 6) rect(x, 0, y, W, 1, 'rgba(0,0,0,0.08)');
      for (const tx of [30, 120, 200]) { rect(x, tx, 14, 18, 20, fc); for (let X = tx; X < tx + 18; X += 6) rect(x, X, 10, 4, 4, fc); rect(x, tx + 7, 20, 3, 5, 'rgba(0,0,0,0.25)'); }
    } else if (type === 'crowd') {
      rect(x, 0, 24, W, 36, fc);
      for (let r = 0; r < 4; r++) for (let X = 2 + (r % 2) * 3; X < W; X += 6) {
        const col = ['#c23a3a', '#3a70c0', '#3c9c72', '#d29c3a', '#8c5ca2', '#e8e4dc'][Math.floor(hash2(X, r, 3) * 6)];
        rect(x, X, 27 + r * 8, 4, 4, col); rect(x, X + 1, 25 + r * 8, 2, 2, ['#f8d2aa', '#dba678', '#9a6240'][Math.floor(hash2(X, r, 5) * 3)]);
      }
      rect(x, 0, 58, W, 2, '#9e8c6a');
    } else if (type === 'beams') {
      rect(x, 0, 0, W, 60, '#3a2c26');
      for (let X = 10; X < W; X += 40) { rect(x, X, 0, 8, 60, fc); rect(x, X, 0, 2, 60, '#8a6a4a'); }
      rect(x, 0, 12, W, 6, fc);
      for (let X = 30; X < W; X += 70) { rect(x, X, 34, 12, 12, '#6a4a2a'); rect(x, X + 2, 36, 8, 8, '#f2c060'); }
    }
  }
  if (B.hill) {
    for (let X = 0; X < W; X++) {
      const h1 = 44 + Math.round(Math.sin(X / 23) * 4 + Math.sin(X / 9) * 1.5);
      rect(x, X, h1, 1, 1, B.hill[0]); rect(x, X, h1 + 1, 1, 60, B.hill[1]);
      const h2 = 52 + Math.round(Math.sin(X / 31 + 2) * 3);
      rect(x, X, h2, 1, 60, B.hill[2]);
    }
  }
  const deco = (i, ox, oy) => {
    if (B.deco === 'olive') {
      for (let yy = -4; yy <= 3; yy++) for (let xx = -6; xx <= 6; xx++) if ((xx / 6) ** 2 + (yy / 4) ** 2 <= 1) px(x, ox + xx, oy + yy, yy < -1 ? '#8aae70' : '#76a05e');
      rect(x, ox, oy + 3, 1, 3, '#6a5a48');
    } else if (B.deco === 'cypress') {
      for (let yy = -12; yy <= 3; yy++) { const w = Math.round(3 * Math.sin(Math.PI * (yy + 12) / 16)); rect(x, ox - w, oy + yy, w * 2 + 1, 1, yy < -4 ? '#4e7c44' : '#3e6a38'); }
    } else if (B.deco === 'fir') {
      for (let yy = -10; yy <= 3; yy++) { const w = Math.round((yy + 10) / 3); rect(x, ox - w, oy + yy, w * 2 + 1, 1, '#3e6a44'); }
      rect(x, ox, oy + 4, 1, 2, '#5a4030');
    } else if (B.deco === 'palm') {
      rect(x, ox, oy - 8, 1, 14, '#8a6a44');
      for (const [dx, dy] of [[-5, -9], [-3, -10], [3, -10], [5, -9], [-6, -7], [6, -7]]) rect(x, ox + Math.min(0, dx), oy + dy, Math.abs(dx), 1, '#5a9a44');
    } else if (B.deco === 'mill' && i % 4 === 1) {
      rect(x, ox - 3, oy - 10, 6, 14, '#f6f2ea'); rect(x, ox - 3, oy - 12, 6, 2, '#8a5040');
      for (let k = -6; k <= 6; k++) { px(x, ox + k, oy - 11 + k, '#6a5040'); px(x, ox + k, oy - 11 - k, '#6a5040'); }
    } else if (B.deco === 'reed') {
      for (let k = 0; k < 5; k++) rect(x, ox - 4 + k * 2, oy - 6 + (k % 2) * 2, 1, 8, '#8a9a4c');
    }
  };
  if (B.deco && B.deco !== 'deck') for (let i = 0; i < 9; i++) deco(i, 10 + i * 27 + Math.round(hash2(i, 3, 1) * 8), 46 + Math.round(hash2(i, 4, 1) * 6));
  rect(x, 0, 60, W, 52, B.ground[0]);
  for (let y = 60; y < 112; y += 6) rect(x, 0, y, W, 1, B.ground[1]);
  if (B.deco === 'deck') {
    for (let y = 60; y < 112; y += 7) { rect(x, 0, y, W, 1, '#7a4c28'); for (let X = (y * 13) % 40; X < W; X += 40) rect(x, X, y, 1, 7, '#7a4c28'); }
    rect(x, 0, 56, W, 4, '#5a3a1c'); for (let X = 4; X < W; X += 14) rect(x, X, 50, 3, 8, '#5a3a1c');
  }
  const P = B.plat;
  const plat = (cx, cy, rx, ry) => {
    for (let y = -ry - 2; y <= ry + 2; y++) for (let X = -rx - 2; X <= rx + 2; X++) {
      const d = (X / rx) ** 2 + (y / ry) ** 2;
      if (d <= 1) px(x, cx + X, cy + y, y < -ry * 0.3 ? P[0] : P[1]);
      else if ((X / (rx + 2)) ** 2 + (y / (ry + 2)) ** 2 <= 1) px(x, cx + X, cy + y, P[2]);
    }
    for (let X = -rx + 6; X < rx - 6; X += 5) px(x, cx + X, cy + Math.round(hash2(X, cy, 2) * ry * 0.6), P[3]);
  };
  plat(176, 56, 46, 9);
  plat(70, 122, 60, 14);
  return c;
}

  });
  rect(x, 64, 88, 8, 16, '#1a0f22');
  for (const [wx, wy] of [[39, 78], [93, 74], [93, 84], [54, 88], [80, 88]]) rect(x, wx, wy, 2, 4, '#f6c060');
  rect(x, 94, 54, 1, 12, C);

  for (const [ox, oy, s] of [[16, 118, 1], [138, 120, 1.2], [206, 114, 1.1], [226, 122, 0.8]]) {

      if (v <= 1) px(x, ox + xx, oy + yy, '#24152c');
    }

// ─── Herramientas para los mapas: dibujos de texto, entrenadores, edificios ───
// Mapa dibujado con texto: cada carácter es una casilla (ver la leyenda en 10-world.js)
function asciiMap(rows) {
  const w = Math.max(...rows.map(r => r.length));
  const g = rows.map(r => r.padEnd(w, '.').split(''));
  g.ragged = rows.map((r, i) => (r.length !== w ? i : -1)).filter(i => i >= 0);
  // los olivos ocupan bloques de 2×2 alineados en casillas pares
  for (let j = 0; j < g.length; j++) for (let i = 0; i < w; i++) if (g[j][i] === 'T') {
    const bi = i - (i % 2), bj = j - (j % 2);
    for (const [a, b] of [[bi, bj], [bi + 1, bj], [bi, bj + 1], [bi + 1, bj + 1]]) if (g[b] && g[b][a] !== undefined) g[b][a] = 'T';
  }
  return g;
}

// Título de un enemigo en los dos idiomas ("MARINERO" / "MARIN")
function bothLang(x) { return typeof x === 'string' ? { es: x, fr: x } : x; }

// Entrenador: te ve desde lejos, se acerca y te reta. Una vez vencido, solo habla.
// o: id, look, x, y, dir, range, foe, level, name, title, intro, lose, win, after, post, bg, gold, cond, wander
function trainer(o) {
  const flag = o.flag || 'tr_' + o.id;
  const title = bothLang(o.title || FOES[o.foe].name);
  const full = o.name ? { es: title.es + ' ' + o.name, fr: title.fr + ' ' + o.name } : title;
  return {
    id: o.id, look: o.look, x: o.x, y: o.y, dir: o.dir || 'down', cond: o.cond, spec: o,
    trainer: { range: o.range ?? 4, flag },
    talk: async (W, e) => {
      if (W.flag(flag)) { await W.say(o.after || o.lose); return; }
      e.dir = W.dirTo(e, W.player); W.player.dir = W.dirTo(W.player, e);
      if (o.intro) await W.say(o.intro);
      const res = await W.battle({ foe: o.foe, level: o.level, look: o.look, trainer: full, name: o.name ? o.name.toUpperCase() : undefined,
        canLose: false, canFlee: false, defeatText: o.lose, winText: o.win, bg: o.bg, gold: o.gold });
      if (res === 'win') {
        W.flag(flag, true);
        if (o.post) await o.post(W, e);
      }
    },
  };
}

function grid(w, h, f = '.') { return Array.from({ length: h }, () => Array(w).fill(f)); }
function fillG(g, x, y, w, h, c) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < g[0].length) g[j][i] = c;
}
function putG(g, pts, c) { for (const [x, y] of pts) if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
function tallG(g, x, y, w, h) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && g[j][i] === '.') g[j][i] = ',';
}

async function scriptIntroVillage(W) {
  const m = W.npc('madre');
  W.player.dir = 'left';
  await W.wait(400);
  await W.say({ es: '¡{name}! Por fin te veo.', fr: '{name} ! Enfin te voilà.' });
  await W.say({ es: 'Maese Esteban te espera en la palestra, al este de la plaza. ¡Hoy te toma como {esc}!', fr: 'Maître Esteban t\'attend à la palestre, à l\'est de la place. Aujourd\'hui, il te prend comme {esc} !' });
  await W.say({ es: 'Y ya sabes: si te hacen daño, vuelve a casa y te curo.', fr: 'Et tu sais : si tu es blessé{e}, reviens à la maison et je te soignerai.' });
  m.dir = 'right';
  await W.say({ es: '(Cruceta: moverse · A: hablar · B mantenido: correr · MENÚ: abrir el menú)', fr: '(Croix : se déplacer · A : parler · B maintenu : courir · MENU : ouvrir le menu)' }, { color: 'blue' });
  W.flag('introDone', true);
}

async function scriptGuardStop(W) {
  const gd = W.npc('guardia');
  gd.dir = 'right';
  W.player.dir = 'left';
  await W.say({ es: '¡Alto ahí, {name}!', fr: 'Halte-là, {name} !' });
  await W.say(L_.noPermit);
  await W.walk(W.player, 'down', 1);
}

async function scriptEsteban(W) {
  const e = W.npc('esteban');
  if (W.flag('rivalDone')) {
    if (P().hp < P().maxHp) {
      await W.say({ es: 'Ven, que te curo esas heridas.', fr: 'Viens, je vais soigner ces blessures.' });
      W.heal(); Sfx.play('heal');
      await W.say(L_.recoverAll);
    }
    await W.say(L_.firstChallenge);
    return;
  }
  const r = W.npc('rival');
  await W.say({ es: '¡Ah, {name}! Llegas justo a tiempo.', fr: 'Ah, {name} ! Tu arrives juste à temps.' });
  await W.say({ es: 'Llevas años mirando cómo entreno a otros. Hoy por fin te tomo como {esc}.', fr: 'Depuis des années, tu me regardes entraîner les autres. Aujourd\'hui, je te prends enfin comme {esc}.' });
  await W.say({ es: 'Toma. Esta espada es para ti.', fr: 'Tiens. Cette épée est pour toi.' });
  Sfx.play('item');
  await W.say({ es: '{name} recibe una ESPADA CORTA.', fr: '{name} reçoit une ÉPÉE COURTE.' }, { color: 'blue' });
  await W.say({ es: 'Escucha bien. Desde la tregua, las Seis Coronas resuelven sus disputas en los coliseos.', fr: 'Écoute bien. Depuis la trêve, les Six Couronnes règlent leurs querelles dans les colisées.' });
  await W.say({ es: 'Hay ocho. Quien vence a un maestro de coliseo gana su blasón.', fr: 'Il y en a huit. Qui bat un maître de colisée gagne son blason.' });
  await W.say({ es: 'Con los ocho blasones podrás entrar en la Gran Liga de Alta Corona... y te armarán caballero.', fr: 'Avec les huit blasons, tu pourras entrer dans la Grande Ligue de Haute-Couronne... et tu seras adoubé{e} {cab}.' });
  // aparece el rival
  r.dir = 'left';
  W.bubble(r);
  Sfx.play('alert');
  await W.wait(700);
  W.bubble(null);
  await W.say({ es: '{rival}: ¡Padre! ¿Le das una espada a {name} y a mí no?', fr: '{rival} : Père ! Tu donnes une épée à {name} et pas à moi ?' });
  await W.walkNextTo(r, W.player);
  W.faceEachOther(r, W.player);
  await W.say({ es: '{rival}: ¡Yo llevo más tiempo entrenando! {name}, ¡te reto a un duelo!', fr: '{rival} : Ça fait plus longtemps que je m\'entraîne ! {name}, je te défie en duel !' });
  e.dir = W.dirTo(e, W.player);
  await W.say({ es: 'ESTEBAN: Je... Un duelo amistoso. Adelante, que os vea.', fr: 'ESTEBAN : Hé hé... Un duel amical. Allez-y, montrez-moi.' });
  const winText = { es: '¡Ja! ¡Te falta mucho entrenamiento!', fr: 'Ha ! Tu as encore beaucoup à apprendre !' };
  const res = await W.battle({ foe: 'rival', level: 3, name: rivalName().toUpperCase(), look: rivalLook(), trainer: rivalName(), canLose: true, canFlee: false,
    defeatText: { es: '¿Qué? ¡No puede ser!', fr: 'Quoi ? Impossible !' }, winText });
  if (res === 'win') {
    await W.say({ es: '{rival}: Grr... Ha sido suerte. ¡La próxima vez gano yo!', fr: '{rival} : Grr... C\'était de la chance. La prochaine fois, c\'est moi qui gagne !' });
  } else {
    await W.say({ es: '{rival}: ' + winText.es, fr: '{rival} : ' + winText.fr });
    await W.say({ es: 'ESTEBAN: No pasa nada, {name}. Hasta los mejores caballeros cayeron en su primer duelo.', fr: 'ESTEBAN : Ce n\'est rien, {name}. Même les meilleurs chevaliers ont perdu leur premier duel.' });
  }
  await W.say({ es: 'ESTEBAN: Buen combate. Venid, que os curo esos golpes.', fr: 'ESTEBAN : Beau combat. Venez, je vais soigner ces coups.' });
  W.heal(); Sfx.play('heal');
  await W.say(L_.recoverAll);
  await W.say({ es: 'ESTEBAN: Llévate también estas cinco HOGAZAS para el camino.', fr: 'ESTEBAN : Prends aussi ces cinq MICHES pour la route.' });
  W.give('hogaza', 5);
  Sfx.play('item');
  await W.say(t('w_receive', { q: itemQty('hogaza', 5) }), { color: 'blue' });
  await W.say({ es: 'ESTEBAN: Una cosa más. Cuanto más camines en la vida real, más fuerte te harás.', fr: 'ESTEBAN : Encore une chose. Plus tu marcheras dans la vraie vie, plus tu deviendras fort{e}.' });
  await W.say({ es: 'ESTEBAN: Cada kilómetro que andes te dará ducados y objetos. Míralo en CAMINATA, dentro del MENÚ.', fr: 'ESTEBAN : Chaque kilomètre parcouru te rapportera des ducats et des objets. Regarde dans MARCHE, dans le MENU.' });
  if (Pasos.native) await W.activateSteps();
  await W.say({ es: 'ESTEBAN: Y ahora, al norte por la Ruta 1. El coliseo de Toledo es tu primer reto.', fr: 'ESTEBAN : Et maintenant, cap au nord par la Route 1. Le colisée de Tolède est ton premier défi.' });
  await W.say({ es: '{rival}: ¡Nos vemos en Toledo, {name}! ¡Allí te ganaré yo!', fr: '{rival} : On se retrouve à Tolède, {name} ! Là-bas, c\'est moi qui gagnerai !' });
  await W.walkTo(r, 16, 12);
  r.dir = 'left';
  await W.walk(r, 'left', 1);
  await W.fadeNpc(r);
  W.flag('rivalDone', true);
  W.flag('canLeave', true);
  Game.save();
}

async function trainerMartin(W, n) {
  n.dir = W.dirTo(n, W.player);
  W.player.dir = W.dirTo(W.player, n);
  await W.say({ es: 'MARTÍN: ¡Eh, tú! Tienes pinta de {esc} novat{o}. ¡En guardia!', fr: 'MARTIN : Hé, toi ! Tu as l\'air d\'un{e} {esc} débutant{e}. En garde !' });
  const res = await W.battle({ foe: 'martin', level: 4, look: 'martin', trainer: { es: 'Martín', fr: 'Martin' }, canLose: false, canFlee: false,
    defeatText: { es: '¡Vaya brazo tienes!', fr: 'Quel bras tu as !' }, winText: { es: 'Vuelve cuando hayas entrenado más.', fr: 'Reviens quand tu te seras mieux entraîné{e}.' } });
  if (res === 'win') {
    W.flag('beatMartin', true);
    await W.say({ es: 'MARTÍN: Sigue así y llegarás lejos.', fr: 'MARTIN : Continue comme ça et tu iras loin.' });
  }
  return res;
}

// ─── Guiones de España ────────────────────────────────────────────────────
async function scriptRivalToledo(W) {
  W.flag('rivalToledo', true);
  const p = W.player;
  p.dir = 'up';
  const r = W.spawn({ id: 'rival_to', look: rivalLook(), x: 15, y: 19, dir: 'down' });
  W.bubble(r); Sfx.play('alert'); await W.wait(700); W.bubble(null);
  await W.say({ es: '{rival}: ¡{name}! Sabía que llegarías tarde.', fr: '{rival} : {name} ! Je savais que tu arriverais en retard.' });
  await W.walkNextTo(r, p);
  W.faceEachOther(r, p);
  await W.say({ es: '{rival}: He entrenado toda la semana en la sierra. ¡Esta vez no tienes nada que hacer!', fr: '{rival} : Je me suis entraîné{e} toute la semaine dans la sierra. Cette fois, tu n\'as aucune chance !' });
  const res = await W.battle({ foe: 'rival', level: 10, name: rivalName().toUpperCase(), look: rivalLook(), trainer: rivalName(), canLose: true, canFlee: false,
    defeatText: { es: '¡Otra vez! ¿Cómo lo haces?', fr: 'Encore ! Comment tu fais ?' }, winText: { es: '¡Te lo dije!', fr: 'Je te l\'avais dit !' } });
  if (res === 'win') await W.say({ es: '{rival}: Grr... Vale, entra tú primero en el coliseo. Yo seguiré entrenando.', fr: '{rival} : Grr... D\'accord, entre en premier au colisée. Moi, je continue à m\'entraîner.' });
  else {
    healPlayer();

async function scriptRodrigo(W) {

  if (W.flag('blason_toledo')) {

  }
  await W.say({ es: 'DON RODRIGO: Así que tú eres {el} {esc} de Esteban. Llevo cuarenta años forjando espadas en esta ciudad.', fr: 'DON RODRIGO : Alors c\'est toi l\'{esc} d\'Esteban. Je forge des épées dans cette ville depuis quarante ans.' });
  await W.say({ es: 'DON RODRIGO: Una espada se templa con fuego y agua. Un {cab}, con combates. ¡Veamos de qué acero estás hech{o}!', fr: 'DON RODRIGO : Une épée se trempe dans le feu et l\'eau. Un{e} {cab}, dans les combats. Voyons de quel acier tu es fait{e} !' });

    defeatText: { es: '¡Ja! ¡Golpeas como un martillo pilón!', fr: 'Ha ! Tu frappes comme un marteau-pilon !' }, winText: { es: 'Vuelve a la forja, {esc}. Aún te falta temple.', fr: 'Retourne à la forge, {esc}. Il te manque encore de la trempe.' } });

async function scriptSelloCastilla(W) {
  W.flag('selloRobado', true);
  W.flag('toledoOpen', true);

  const c = W.spawn({ id: 'cap_run', look: 'guard', x: 4, y: 12, dir: 'right' });
  W.bubble(c); Sfx.play('alert'); await W.wait(600); W.bubble(null);
  await W.say({ es: '¡{name}! ¡{name}! ¡Menos mal que te encuentro!', fr: '{name} ! {name} ! Heureusement que je te trouve !' });

  W.faceEachOther(c, p);
  await W.say({ es: 'CAPITÁN: ¡Han asaltado el ALCÁZAR mientras todos miraban tu combate! ¡Se han llevado el SELLO DE CASTILLA!', fr: 'CAPITAINE : On a attaqué l\'ALCAZAR pendant que tout le monde regardait ton combat ! Ils ont volé le SCEAU DE CASTILLE !' });

  await W.say({ es: 'CAPITÁN: Sin el sello, la tregua de Castilla se rompe. Huyeron por la PUERTA DEL ESTE, hacia La Mancha y la costa.', fr: 'CAPITAINE : Sans le sceau, la trêve de Castille est rompue. Ils ont fui par la PORTE EST, vers la Manche et la côte.' });

async function scriptBarcoTarifa(W) {
  if (W.flag('visitTanger')) {
    const r = await W.ask({ es: 'CAPITANA: ¿Cruzamos a TÁNGER?', fr: 'CAPITAINE : On traverse vers TANGER ?' }, [t('yes'), t('no')]);
    if (r === 0) await W.sail({ map: 'tanger', x: 15, y: 4, dir: 'down' }, { es: 'Rumbo a TÁNGER', fr: 'Cap sur TANGER' });
    return;
  }
  await W.say({ es: 'CAPITANA: Soy la capitana de LA GAVIOTA. ¿Quieres cruzar el Estrecho hasta TÁNGER?', fr: 'CAPITAINE : Je suis la capitaine de LA MOUETTE. Tu veux traverser le détroit jusqu\'à TANGER ?' });
  await W.say({ es: 'CAPITANA: ¿Persigues al barco de velas negras? Zarpó ayer. Te llevo, pero en el mar hay corsarios: ve preparad{o}.', fr: 'CAPITAINE : Tu poursuis le bateau aux voiles noires ? Il est parti hier. Je t\'emmène, mais il y a des corsaires en mer : sois prêt{e}.' });

  await W.warp({ map: 'ruta5', x: 3, y: 7, dir: 'right' });

// ─── Misión secreta: don Quijote y el emblema del Matagigantes ────────────
async function scriptQuijote(W) {
  if (W.flag('quijoteHecho')) {
    await W.say({ es: 'QUIJOTE: ¡Salud, {cab} Matagigantes! Que Dulcinea y Rocinante te acompañen en cada aventura.', fr: 'QUICHOTTE : Salut à toi, {cab} {Tueur} de géants ! Que Dulcinée et Rossinante t\'accompagnent dans chaque aventure.' });
    return;
  }
  if (!W.flag('quijote1')) {
    await W.say({ es: 'QUIJOTE: ¡Atrás, gigantes! ...Ah, perdón. Te había confundido con un molino.', fr: 'QUICHOTTE : Arrière, géants ! ...Ah, pardon. Je t\'avais pris pour un moulin.' });
    await W.say({ es: 'QUIJOTE: Soy don Quijote de la Mancha, {cab} andante. En un lugar de la Mancha, de cuyo nombre no quiero acordarme...', fr: 'QUICHOTTE : Je suis don Quichotte de la Manche, chevalier errant. Dans un village de la Manche, dont je ne veux pas me rappeler le nom...' });
    await W.say({ es: 'QUIJOTE: ¡Ay, qué desdicha! Ahora tampoco me acuerdo del nombre de mi amada, la señora de mis pensamientos. ¿Me ayudas a recordarlo?', fr: 'QUICHOTTE : Hélas, quel malheur ! Je ne me rappelle plus non plus le nom de ma bien-aimée, la dame de mes pensées. Tu m\'aides à m\'en souvenir ?' });
    const r1 = await W.ask({ es: '¿Cómo se llama la amada de don Quijote?', fr: 'Comment s\'appelle la bien-aimée de don Quichotte ?' },
      [{ es: 'MELIBEA', fr: 'MÉLIBÉE' }, { es: 'DULCINEA', fr: 'DULCINÉE' }, { es: 'ISOLDA', fr: 'ISEUT' }, { es: 'BEATRIZ', fr: 'BÉATRICE' }].map(tr));
    if (r1 !== 1) {
      await W.say({ es: 'QUIJOTE: No, no... Ese nombre no me hace suspirar. Vuelve cuando lo recuerdes, {name}.', fr: 'QUICHOTTE : Non, non... Ce nom ne me fait pas soupirer. Reviens quand tu t\'en souviendras, {name}.' });
      return;
    }
    await W.say({ es: 'QUIJOTE: ¡DULCINEA! ¡Dulcinea del Toboso, la más hermosa de todas las damas! ¡Gracias, gracias!', fr: 'QUICHOTTE : DULCINÉE ! Dulcinée du Toboso, la plus belle de toutes les dames ! Merci, merci !' });
    await W.say({ es: 'QUIJOTE: ¿Y mi fiel caballo? ¿Cómo se llama? ¡Lo tengo en la punta de la lengua!', fr: 'QUICHOTTE : Et mon fidèle cheval ? Comment s\'appelle-t-il ? Je l\'ai sur le bout de la langue !' });
    const r2 = await W.ask({ es: '¿Cómo se llama el caballo de don Quijote?', fr: 'Comment s\'appelle le cheval de don Quichotte ?' },
      [{ es: 'BABIECA', fr: 'BABIECA' }, { es: 'BUCÉFALO', fr: 'BUCÉPHALE' }, { es: 'ROCINANTE', fr: 'ROSSINANTE' }, { es: 'CLAVILEÑO', fr: 'CLAVILEÑO' }].map(tr));
    if (r2 !== 2) {
      await W.say({ es: 'QUIJOTE: ¿Ese? ¡No! Ese es el caballo de otro {cab}. Vuelve cuando lo sepas.', fr: 'QUICHOTTE : Celui-là ? Non ! C\'est le cheval d\'un autre chevalier. Reviens quand tu le sauras.' });
      return;
    }
    await W.say({ es: 'QUIJOTE: ¡ROCINANTE! ¡El mejor rocín de la Mancha! Toma, por devolverme la memoria.', fr: 'QUICHOTTE : ROSSINANTE ! La meilleure rosse de la Manche ! Tiens, pour m\'avoir rendu la mémoire.' });
    await W.gold(100);
    await W.receive('unguento', 5);
    W.flag('quijote1', true);
    Game.save();
  } else {
    await W.say({ es: 'QUIJOTE: ¡Ah, mi amig{o}! ¿Vienes a por la pregunta sorpresa?', fr: 'QUICHOTTE : Ah, mon ami{e} ! Tu viens pour la question surprise ?' });
  }
  await W.say({ es: 'QUIJOTE: Y ahora, una pregunta sorpresa. Dicen que algún día un tal Cervantes escribirá un libro con mis aventuras...', fr: 'QUICHOTTE : Et maintenant, une question surprise. On dit qu\'un jour, un certain Cervantès écrira un livre sur mes aventures...' });
  const r3 = await W.ask({ es: '¿Cuántas páginas tiene el libro de don Quijote de la Mancha?', fr: 'Combien de pages compte le livre de don Quichotte de la Manche ?' },
    [{ es: '664', fr: '664' }, { es: '0', fr: '0' }, { es: '1.250', fr: '1 250' }, { es: '312', fr: '312' }].map(tr));
  if (r3 !== 1) {
    await W.say({ es: 'QUIJOTE: ¡Ja, ja! Puede que algún día tenga esas páginas... ¡pero piensa bien en qué año estamos! Vuelve cuando lo tengas claro.', fr: 'QUICHOTTE : Ha, ha ! Un jour, il aura peut-être ces pages... mais réfléchis bien à l\'année où nous sommes ! Reviens quand tu auras compris.' });
    return;
  }
  await W.say({ es: 'QUIJOTE: ¡CERO! ¡Exacto! Estamos en 1415: Cervantes ni siquiera ha nacido. Mi libro no se publicará hasta 1605... ¡dentro de 190 años!', fr: 'QUICHOTTE : ZÉRO ! Exactement ! Nous sommes en 1415 : Cervantès n\'est même pas né. Mon livre ne sera publié qu\'en 1605... dans 190 ans !' });
  await W.say({ es: 'QUIJOTE: Hoy mis aventuras solo existen en mi cabeza. ¡Qué ingenio el tuyo! Te nombro MATAGIGANTES.', fr: 'QUICHOTTE : Aujourd\'hui, mes aventures n\'existent que dans ma tête. Quel esprit tu as ! Je te nomme {TUEUR} DE GÉANTS.' });
  Sfx.play('win');
  W.flag('emblemaMatagigantes', true);
  await W.say({ es: '¡{name} recibe el EMBLEMA DEL MATAGIGANTES!', fr: '{name} reçoit l\'EMBLÈME DU TUEUR DE GÉANTS !' }, { color: 'blue' });
  const up = await W.levelTo(35);
  if (!up) await W.say({ es: 'QUIJOTE: Ya eres más fuerte que cualquier gigante. ¡El emblema te queda de maravilla!', fr: 'QUICHOTTE : Tu es déjà plus fort{e} que n\'importe quel géant. L\'emblème te va à merveille !' });
  await W.say({ es: 'QUIJOTE: Y toma mi ESPADA MATAGIGANTES. Con ella vencí a cien gigantes... bueno, a cien molinos.', fr: 'QUICHOTTE : Et prends mon ÉPÉE TUE-GÉANTS. Avec elle, j\'ai vaincu cent géants... enfin, cent moulins.' });
  Sfx.play('item');
  W.giveEquip('matagigantes', true);
  await W.say({ es: '¡{name} recibe la ESPADA MATAGIGANTES (+25 ATQ)!', fr: '{name} reçoit l\'ÉPÉE TUE-GÉANTS (+25 ATT) !' }, { color: 'blue' });
  W.flag('quijoteHecho', true);
  Game.save();
}
