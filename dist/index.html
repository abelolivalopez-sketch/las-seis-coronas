<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
</head>
<body>
<title>Las Seis Coronas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Prototipo jugable de Las Seis Coronas: RPG medieval por turnos en pixel art.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  /* Consola de mano: pantalla 3:2 arriba, cruceta y botones abajo (en horizontal, a los lados) */
  :root {
    --shell: #2a2140;
    --shell-hi: #3a2f57;
    --shell-lo: #16111f;
    --bezel: #0d0a14;
    --ink: #f1e6cd;
    --muted: #9d90b4;
    --gold: #e5b44f;
    --btn: #43375e;
    --btn-hi: #5b4d7c;
    --btn-a: #b6463b;
    --btn-b: #3d6aa1;
    --paper: #fbf4e0;
    --paper-ink: #3c3434;
    --paper-edge: #7a4d26;
    --ui: "Silkscreen", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--shell-lo);
    color: var(--ink);
    font-family: var(--ui);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .console {
    box-sizing: border-box;
    height: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "screen screen screen" "dpad mid ab" "hint hint hint";
    align-items: center;
    column-gap: 12px;
    row-gap: 10px;
    background:
      radial-gradient(120% 60% at 50% 0%, var(--shell-hi) 0%, var(--shell) 55%, var(--shell-lo) 100%);
  }
  .screen-wrap {
    grid-area: screen;
    justify-self: center;
    width: 100%;
    max-width: min(720px, calc((100dvh - 250px) * 1.5));
    position: relative;
    box-sizing: border-box;
    background: var(--bezel);
    border-radius: 14px 14px 34px 14px;
    padding: 10px 10px 8px;
    box-shadow: inset 0 0 0 2px #241c33, 0 6px 0 #0a0710;
  }
  #screen {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    height: auto;
    max-width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0810;
    border-radius: 3px;
  }
  .brand {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .brand b { color: var(--gold); font-weight: 700; }

  /* cruceta */
  .dpad {
    grid-area: dpad;
    justify-self: start;
    position: relative;
    width: 138px;
    height: 138px;
    touch-action: none;
  }
  .dpad::before, .dpad::after {
    content: "";
    position: absolute;
    background: var(--btn);
    border-radius: 8px;
    box-shadow: 0 4px 0 #120d1b, inset 0 2px 0 var(--btn-hi);
  }
  .dpad::before { left: 46px; top: 4px; width: 46px; height: 130px; }
  .dpad::after { top: 46px; left: 4px; width: 130px; height: 46px; }
  .dpad i {
    position: absolute;
    z-index: 1;
    width: 0; height: 0;
    border: 8px solid transparent;
    opacity: 0.55;
  }
  .dpad .u { left: 61px; top: 16px; border-bottom-color: var(--ink); }
  .dpad .d { left: 61px; bottom: 16px; border-top-color: var(--ink); }
  .dpad .l { top: 61px; left: 16px; border-right-color: var(--ink); }
  .dpad .r { top: 61px; right: 16px; border-left-color: var(--ink); }
  .dpad[data-dir="up"] .u, .dpad[data-dir="down"] .d, .dpad[data-dir="left"] .l, .dpad[data-dir="right"] .r { opacity: 1; }
  .dpad .hub { position: absolute; z-index: 1; left: 59px; top: 59px; width: 20px; height: 20px; border-radius: 50%; background: #352a4c; }

  .mid { grid-area: mid; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pill {
    font: 700 11px/1 var(--ui);
    letter-spacing: 0.1em;
    color: var(--ink);
    background: var(--btn);
    border: 0;
    border-radius: 999px;
    padding: 9px 16px;
    box-shadow: 0 3px 0 #120d1b, inset 0 1px 0 var(--btn-hi);
    touch-action: none;
    cursor: pointer;
  }
  .ab {
    grid-area: ab;
    justify-self: end;
    position: relative;
    width: 148px;
    height: 120px;
  }
  .btn {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 0;
    font: 700 20px/1 var(--ui);
    color: #fff4e4;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 5px 0 #120d1b, inset 0 3px 0 rgba(255, 255, 255, 0.22);
  }
  .btn.a { right: 0; top: 8px; background: var(--btn-a); }
  .btn.b { left: 0; bottom: 4px; background: var(--btn-b); }
  .btn small { display: block; margin-top: 4px; font-size: 8px; letter-spacing: 0.06em; opacity: 0.85; }
  .btn.on, .pill.on { transform: translateY(3px); box-shadow: 0 2px 0 #120d1b, inset 0 3px 0 rgba(255, 255, 255, 0.12); }
  .btn:focus-visible, .pill:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .hint {
    grid-area: hint;
    margin: 0;
    text-align: center;
    font-size: 10px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-wrap: balance;
  }
  .hint kbd { font: inherit; color: var(--ink); background: var(--btn); padding: 1px 5px; border-radius: 4px; }
  @media (hover: none) and (pointer: coarse) { .hint { display: none; } }

  /* teléfono en horizontal: controles a los lados de la pantalla */
  @media (orientation: landscape) and (max-height: 540px) {
    .console {
      max-width: none;
      grid-template-columns: auto 1fr auto;
      grid-template-rows: 1fr auto;
      grid-template-areas: "dpad screen ab" "dpad mid ab";
      padding-block: 8px;
      row-gap: 6px;
    }
    .screen-wrap { max-width: calc((100dvh - 70px) * 1.5); padding: 6px 6px 4px; border-radius: 10px; }
    .brand { display: none; }
    .hint { display: none; }
    .dpad { justify-self: center; }
    .ab { justify-self: center; }
  }
  @media (max-width: 560px) and (orientation: portrait) {
    .console {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto 1fr auto;
      grid-template-areas: "screen screen" "dpad ab" "mid mid";
      row-gap: 14px;
    }
    .screen-wrap { padding: 8px 8px 6px; border-radius: 12px 12px 28px 12px; }
    .mid { padding-bottom: 8px; }
  }
  @media (max-width: 370px) {
    .dpad { transform: scale(0.88); transform-origin: left center; }
    .ab { transform: scale(0.88); transform-origin: right center; }
  }

  /* nombre del personaje */
  .name-dlg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(13, 10, 20, 0.62);
    border-radius: inherit;
    z-index: 5;
  }
  .name-dlg form {
    display: grid;
    gap: 10px;
    width: min(300px, 86%);
    box-sizing: border-box;
    padding: 16px;
    background: var(--paper);
    color: var(--paper-ink);
    border: 3px solid var(--paper-edge);
    border-radius: 6px;
    box-shadow: 0 0 0 2px var(--gold) inset;
  }
  .name-dlg label { font: 700 13px/1.3 var(--ui); }
  .name-dlg input {
    font: 16px/1.2 var(--ui);
    padding: 8px 10px;
    color: var(--paper-ink);
    background: #fffaf0;
    border: 2px solid var(--paper-edge);
    border-radius: 4px;
    user-select: text;
    -webkit-user-select: text;
  }
  .name-dlg input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .name-dlg button {
    font: 700 13px/1 var(--ui);
    padding: 10px;
    color: #fff4e4;
    background: var(--btn-a);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .name-dlg small { font-size: 10px; color: #7a6a5a; }
  @media (prefers-reduced-motion: reduce) { .btn.on, .pill.on { transform: none; } }
</style>

<main class="console">
  <div class="screen-wrap">
    <canvas id="screen" width="240" height="160" aria-label="Pantalla del juego Las Seis Coronas"></canvas>
    <div class="brand"><b data-es="LAS SEIS CORONAS" data-fr="LES SIX COURONNES">LAS SEIS CORONAS</b><span data-es="prototipo v0.2" data-fr="prototype v0.2">prototipo v0.2</span></div>
    <div class="name-dlg" id="nameDlg" hidden>

<script>
(function () {
// ── 00-core.js ──
'use strict';
// ─── Núcleo: constantes, utilidades, reloj de juego, sonido ───────────────
const W = 240, H = 160, T = 16;            // resolución interna estilo GBA y tamaño de casilla
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  return [c, x];
}

function hash2(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul((s | 0) + 7, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function px(ctx, x, y, c) { ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1); }
function rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

// Pinta un dibujo hecho con letras (cada letra es un color de la paleta)
function paintRows(ctx, rows, pal, ox = 0, oy = 0, flip = false) {
  for (let y = 0; y < rows.length; y++) {
    const r = rows[y], n = r.length;
    for (let x = 0; x < n; x++) {
      const ch = r[x];
      if (ch === '.' || ch === ' ') continue;
      const c = pal[ch];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(ox + (flip ? n - 1 - x : x), oy + y, 1, 1);
    }
  }
}

// ─── Reloj del juego: esperas y animaciones (tweens) ──────────────────────
const Clock = {
  t: 0, timers: [], tweens: [],
  update(dt) {
    this.t += dt;
    for (let i = this.timers.length - 1; i >= 0; i--) {
      const tm = this.timers[i];
      tm.left -= dt;
      if (tm.left <= 0) { this.timers.splice(i, 1); tm.fn(); }
    }
    for (let i = this.tweens.length - 1; i >= 0; i--) {
      const tw = this.tweens[i];
      tw.e += dt;
      const k = Math.min(1, tw.e / tw.d), v = tw.ease(k);
      for (const p in tw.to) tw.o[p] = tw.from[p] + (tw.to[p] - tw.from[p]) * v;
      if (k >= 1) { this.tweens.splice(i, 1); tw.done(); }
    }
  },
};
function wait(ms) { return new Promise(r => Clock.timers.push({ left: ms, fn: r })); }
const Ease = {
  lin: k => k,
  out: k => 1 - (1 - k) * (1 - k),
  in: k => k * k,
  io: k => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
};
function tween(o, to, d, ease = Ease.out) {
  return new Promise(r => {
    const from = {};
    for (const p in to) from[p] = o[p];
    Clock.tweens.push({ o, to, from, d: Math.max(1, d), e: 0, ease, done: r });
  });
}

// ─── Sonido: pitidos sintetizados (sin archivos) ──────────────────────────
const Sfx = {
  ctx: null, on: true,
  unlock() {
    // iPhone: el audio solo arranca dentro de un toque y se queda "interrupted" al volver de otra app
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const s = this.ctx.createBufferSource();
      s.buffer = this.ctx.createBuffer(1, 1, 22050);
      s.connect(this.ctx.destination);
      s.start(0);
    } catch (e) { this.ctx = null; }
  },
  tone(f, d, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    const c = this.ctx;
    if (!c || !this.on) return;
    try {
      const t0 = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t0 + d);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g).connect(c.destination);
      o.start(t0); o.stop(t0 + d + 0.03);
    } catch (e) { /* sin sonido */ }
  },
  noise(d, vol = 0.08, delay = 0) {
    const c = this.ctx;
    if (!c || !this.on) return;
    try {
      const len = Math.floor(c.sampleRate * d);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const s = c.createBufferSource(), g = c.createGain();
      s.buffer = buf; g.gain.value = vol;
      s.connect(g).connect(c.destination);
      s.start(c.currentTime + delay);
    } catch (e) { /* sin sonido */ }
  },
  play(n) {
    switch (n) {
      case 'blip': this.tone(1046, 0.04, 'square', 0.035); break;
      case 'select': this.tone(784, 0.05, 'square', 0.04); this.tone(1175, 0.07, 'square', 0.04, 0, 0.05); break;
      case 'back': this.tone(523, 0.06, 'square', 0.04, -120); break;
      case 'bump': this.tone(98, 0.09, 'square', 0.05); break;
      case 'hit': this.noise(0.14, 0.12); this.tone(220, 0.12, 'sawtooth', 0.04, -160); break;
      case 'crit': this.noise(0.22, 0.16); this.tone(330, 0.2, 'sawtooth', 0.05, -260); break;
      case 'miss': this.tone(440, 0.12, 'triangle', 0.05, -200); break;
      case 'buff': [523, 659, 784].forEach((f, i) => this.tone(f, 0.08, 'triangle', 0.06, 0, i * 0.06)); break;
      case 'debuff': [784, 659, 523].forEach((f, i) => this.tone(f, 0.08, 'triangle', 0.06, 0, i * 0.06)); break;
      case 'faint': this.tone(392, 0.5, 'square', 0.045, -300); break;
      case 'heal': [659, 784, 988, 1319].forEach((f, i) => this.tone(f, 0.1, 'triangle', 0.06, 0, i * 0.08)); break;
      case 'item': [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.09, 'square', 0.035, 0, i * 0.07)); break;
      case 'level': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.11, 'square', 0.04, 0, i * 0.09)); break;
      case 'encounter': [196, 233, 262, 311, 349, 392].forEach((f, i) => this.tone(f, 0.07, 'sawtooth', 0.035, 0, i * 0.05)); break;
      case 'alert': this.tone(1568, 0.06, 'square', 0.05); this.tone(2093, 0.12, 'square', 0.05, 0, 0.07); break;
      case 'coin': this.tone(1319, 0.05, 'square', 0.04); this.tone(1976, 0.12, 'square', 0.04, 0, 0.05); break;
      case 'win': [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'square', 0.04, 0, i * 0.11)); break;
      case 'door': this.noise(0.08, 0.05); break;
    }
  },
};

// ── 01-input.js ──
// ─── Controles: teclado + cruceta y botones táctiles ──────────────────────
const DIRS = ['up', 'down', 'left', 'right'];
const DV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

const Input = {
  held: {}, pending: new Set(), pressed: new Set(), rep: new Set(), holdT: {}, lastDir: null, locked: false,
  map: {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    KeyZ: 'a', KeyJ: 'a', Enter: 'a', Space: 'a', NumpadEnter: 'a',
    KeyX: 'b', KeyK: 'b', Escape: 'b', Backspace: 'b', ShiftLeft: 'b', ShiftRight: 'b',
    KeyM: 'start', KeyP: 'start', Tab: 'start',
  },
  init() {
    addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      const k = this.map[e.code];
      if (!k) return;
      e.preventDefault();
      if (!e.repeat) this.press(k);
    });
    addEventListener('keyup', e => { const k = this.map[e.code]; if (k) this.release(k); });
    addEventListener('blur', () => { for (const k in this.held) this.held[k] = false; });
    // Safari en iPhone solo deja activar el sonido al levantar el dedo o con un clic
    for (const ev of ['touchend', 'click']) document.addEventListener(ev, () => Sfx.unlock(), { passive: true });

    document.querySelectorAll('[data-btn]').forEach(el => {
      const k = el.dataset.btn;
      el.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        this.press(k); el.classList.add('on');
      });
      const up = () => { this.release(k); el.classList.remove('on'); };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
      el.addEventListener('lostpointercapture', up);
      el.addEventListener('contextmenu', e => e.preventDefault());
    });

    const pad = document.getElementById('dpad');
    if (pad) {
      let active = null;
      const setDir = d => {
        if (d === active) return;
        if (active) this.release(active);
        active = d;
        if (d) this.press(d);
        pad.dataset.dir = d || '';
      };
      const fromEvent = e => {
        const r = pad.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        if (Math.hypot(dx, dy) < r.width * 0.1) return active;
        return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
      };
      pad.addEventListener('pointerdown', e => {
        e.preventDefault();
        try { pad.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        setDir(fromEvent(e));
      });
      pad.addEventListener('pointermove', e => { if (active) setDir(fromEvent(e)); });
      const end = () => setDir(null);
      pad.addEventListener('pointerup', end);
      pad.addEventListener('pointercancel', end);
      pad.addEventListener('lostpointercapture', end);
      pad.addEventListener('contextmenu', e => e.preventDefault());
    }
  },
  press(k) {
    if (!this.held[k]) { this.pending.add(k); this.holdT[k] = 0; }
    this.held[k] = true;
    if (DIRS.includes(k)) this.lastDir = k;
    Sfx.unlock();
  },
  release(k) { this.held[k] = false; },
  poll(dt) {
    this.pressed = this.pending;
    this.pending = new Set();
    this.rep = new Set(this.pressed);
    for (const k of DIRS) {
      if (!this.held[k]) continue;
      const prev = this.holdT[k] || 0, now = prev + dt;
      this.holdT[k] = now;
      if (prev < 380 && now >= 380) this.rep.add(k);
      else if (now > 380 && Math.floor((now - 380) / 110) > Math.floor((prev - 380) / 110)) this.rep.add(k);
    }
    if (this.locked) { this.pressed = new Set(); this.rep = new Set(); }
  },
  hit(k) { return this.pressed.has(k); },
  repeat(k) { return this.rep.has(k); },
  down(k) { return !this.locked && !!this.held[k]; },
  clear() { this.pressed = new Set(); this.rep = new Set(); this.pending = new Set(); },
  dir() {
    if (this.locked) return null;
    if (this.lastDir && this.held[this.lastDir]) return this.lastDir;
    for (const k of DIRS) if (this.held[k]) return k;
    return null;
  },
};

const ACCENTS = {

  'À': ['A', 'grave'], 'È': ['E', 'grave'], 'Ù': ['U', 'grave'],
  'Â': ['A', 'circ'], 'Ê': ['E', 'circ'], 'Î': ['I', 'circ'], 'Ô': ['O', 'circ'], 'Û': ['U', 'circ'],

const Font = {
  LH: 14,               // alto de línea
  glyphs: {},
  cache: {},
  colors: {
    dark: ['#3c3434', '#d6cbb3'],
    light: ['#fbf7ee', '#4a3a52'],
    gold: ['#f8d458', '#5c3210'],
    red: ['#c8302a', '#efc4b0'],
    grey: ['#8c8478', '#e6dcc6'],
    blue: ['#2c56b4', '#c4d4f2'],
    white: ['#ffffff', '#20182a'],
    ink: ['#2a2030', null],
    dim: ['#a898bc', '#1a1424'],
  },
  init() {
    for (const ch in GLYPHS) {
      const rows = GLYPHS[ch];
      const pts = [];
      let w = 0;
      rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') { pts.push([x, y]); w = Math.max(w, x + 1); } });
      if (ch === ' ') w = 3;
      this.glyphs[ch] = { pts, w: Math.max(w, rows[0].length === 1 ? 1 : w) };
      if (!pts.length && ch !== ' ') this.glyphs[ch].w = rows[0].length;
    }
    this.glyphs[' '] = { pts: [], w: 3 };
    for (const ch in ACCENTS) {
      const [base, kind] = ACCENTS[ch];
      const g = this.glyphs[base];
      const upper = base === base.toUpperCase() && base !== 'ı';
      const r0 = upper ? -2 : -1, r1 = upper ? -1 : 0;
      let pts = g.pts.slice();
      let w = g.w;
      if ((kind === 'circ' || kind === 'diaer') && w < 3) { pts = pts.map(([x, y]) => [x + 1, y]); w = 3; }
      const c = Math.floor((w - 1) / 2);
      if (kind === 'acute') { pts.push([c + 1, r0], [c, r1]); w = Math.max(w, c + 2); }
      else if (kind === 'grave') { pts.push([c, r0], [c + 1, r1]); w = Math.max(w, c + 2); }
      else if (kind === 'circ') {
        if (w === 4) pts.push([1, r0], [2, r0], [0, r1], [3, r1]);
        else pts.push([c, r0], [c - 1, r1], [c + 1, r1]);
      }
      else if (kind === 'tilde') { pts.push([0, r1], [1, r0], [2, r1], [3, r0]); if (w >= 5) pts.push([4, r1]); }
      else if (kind === 'diaer') { const rr = upper ? -2 : 0; pts.push([0, rr], [w - 1, rr]); }
      else if (kind === 'cedil') { pts.push([c + 1, 7], [c, 8]); }
      this.glyphs[ch] = { pts, w };
    }
  },
  glyph(ch) { return this.glyphs[ch] || this.glyphs['?']; },
  canvas(ch, color) {
    const key = color + '|' + ch;
    let c = this.cache[key];
    if (c) return c;
    const g = this.glyph(ch);
    const [fg, sh] = this.colors[color] || this.colors.dark;
    const [cv, x] = mkCanvas(g.w + 1, 14);
    if (sh) for (const [gx, gy] of g.pts) px(x, gx + 1, gy + 3, sh);
    for (const [gx, gy] of g.pts) px(x, gx, gy + 2, fg);
    this.cache[key] = cv;
    return cv;
  },
  width(str) {
    let w = 0;
    for (const ch of str) w += this.glyph(ch).w + 1;
    return Math.max(0, w);
  },
  // y = parte de arriba de la celda (las mayúsculas empiezan en y+2)
  draw(ctx, str, x, y, color = 'dark', scale = 1) {
    let cx = x;
    for (const ch of String(str)) {
      const g = this.glyph(ch);
      if (ch !== ' ') {
        const cv = this.canvas(ch, color);
        if (scale === 1) ctx.drawImage(cv, Math.round(cx), Math.round(y));
        else ctx.drawImage(cv, Math.round(cx), Math.round(y), cv.width * scale, cv.height * scale);
      }
      cx += (g.w + 1) * scale;
    }
    return cx;
  },
  drawRight(ctx, str, xRight, y, color) { this.draw(ctx, str, xRight - this.width(str), y, color); },
  drawCenter(ctx, str, xc, y, color, scale = 1) { this.draw(ctx, str, Math.round(xc - this.width(str) * scale / 2), y, color, scale); },
  wrap(str, maxW) {
    const out = [];
    for (const para of String(str).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (this.width(test) <= maxW || !line) line = test;
        else { out.push(line); line = w; }
      }
      out.push(line);
    }
    return out;
  },
};

function lookPalette(L) {
  const sk = SKIN[L.skin], hr = HAIR[L.hair], cl = CLOTH[L.cloth], hs = HOSE[L.hose || 'light'];
  const bd = HAIR[L.beard || L.hair];
  return {
    k: OUTLINE, s: sk[0], S: sk[1], r: sk[2],
    h: hr[0], H: hr[1], l: hr[2],
    t: cl[0], T: cl[1], L: cl[2],
    b: '#6b4426', y: '#f2ca52', p: hs[0], P: hs[1], f: '#4c3426',
    g: bd[0], G: bd[1], m: '#4a4038',
  };
}

function composeRows(base, view, legIdx, overKey) {
  const body = SPR[base][view === 'side' ? 's' : view].slice();
  const legSet = LEGS[base][view === 'side' ? 'side' : 'front'];
  let legs = legSet[legIdx === 0 ? 0 : 1];
  if (legIdx === 2 && view !== 'side') legs = legs.map(r => r.split('').reverse().join(''));
  const rows = body.concat(legs);
  if (overKey) {
    const ov = OVER[overKey][view === 'side' ? 's' : view] || {};
    for (const ri in ov) {
      const o = ov[ri], r = rows[ri].split('');
      for (let i = 0; i < o.length; i++) if (o[i] !== '.') r[i] = o[i];
      rows[ri] = r.join('');
    }
  }
  return rows;
}

// Hoja de 12 fotogramas: abajo 0-2, arriba 3-5, izquierda 6-8, derecha 9-11
function buildCharSheet(L) {
  const pal = lookPalette(L);
  const [c, x] = mkCanvas(16 * 12, 24);
  const views = [['d', false], ['u', false], ['side', false], ['side', true]];
  views.forEach(([v, flip], vi) => {
    for (let f = 0; f < 3; f++) {
      const rows = composeRows(L.base, v, f, L.over);
      paintRows(x, rows, pal, (vi * 3 + f) * 16, 0, flip);
    }
  });
  return c;
}

function grassBase(ctx, ox, oy, tx, ty) {
  rect(ctx, ox, oy, 16, 16, PAL.grass);
  for (let k = 0; k < 3; k++) {
    if (hash2(tx, ty, k) > 0.62) continue;
    const x = ox + 2 + Math.floor(hash2(tx, ty, k + 11) * 11);
    const y = oy + 3 + Math.floor(hash2(tx, ty, k + 21) * 10);
    px(ctx, x, y, PAL.grassD); px(ctx, x + 1, y + 1, PAL.grassD); px(ctx, x + 2, y, PAL.grassD);
    px(ctx, x + 1, y - 1, PAL.grassL);
  }
  if (hash2(tx, ty, 40) < 0.5) px(ctx, ox + Math.floor(hash2(tx, ty, 41) * 16), oy + Math.floor(hash2(tx, ty, 42) * 16), PAL.grassL);
}

function tallGrass(ctx, ox, oy, onlyFront = false) {
  if (!onlyFront) rect(ctx, ox, oy, 16, 16, PAL.tall);
  const rows = onlyFront ? [15] : [7, 15];
  rows.forEach((base, ri) => {
    for (let x = 0; x < 16; x++) {
      const hgt = [2, 5, 7, 5][(x + ri * 2) % 4];
      for (let i = 0; i < hgt; i++) {
        const y = base - i;
        const c = i === hgt - 1 ? PAL.tallL : i === hgt - 2 ? PAL.tallM : (x % 4 === 3 ? PAL.tallD : PAL.tall);
        px(ctx, ox + x, oy + y, c);
      }
    }
  });
}

function dirtTile(ctx, ox, oy, tx, ty, nb, col) {
  rect(ctx, ox, oy, 16, 16, col.b);
  for (let k = 0; k < 6; k++) {
    if (hash2(tx, ty, k + 50) > 0.55) continue;
    px(ctx, ox + Math.floor(hash2(tx, ty, k + 60) * 16), oy + Math.floor(hash2(tx, ty, k + 70) * 16), k % 2 ? col.d : col.l);
  }
  const G = PAL.grass;
  const tooth = (i, s) => (hash2(tx * 17 + i, ty * 13 + s, 9) < 0.35 ? 2 : 1);
  if (nb.n) for (let x = 0; x < 16; x++) { const d = tooth(x, 1); rect(ctx, ox + x, oy, 1, d, G); px(ctx, ox + x, oy + d, col.e); }
  if (nb.s) for (let x = 0; x < 16; x++) { const d = tooth(x, 2); rect(ctx, ox + x, oy + 16 - d, 1, d, G); px(ctx, ox + x, oy + 15 - d, col.e); }
  if (nb.w) for (let y = 0; y < 16; y++) { const d = tooth(y, 3); rect(ctx, ox, oy + y, d, 1, G); px(ctx, ox + d, oy + y, col.e); }
  if (nb.e) for (let y = 0; y < 16; y++) { const d = tooth(y, 4); rect(ctx, ox + 16 - d, oy + y, d, 1, G); px(ctx, ox + 15 - d, oy + y, col.e); }
  if (nb.n && nb.w) { rect(ctx, ox, oy, 4, 3, G); rect(ctx, ox, oy, 3, 4, G); px(ctx, ox + 3, oy + 3, col.e); px(ctx, ox + 4, oy + 3, col.e); px(ctx, ox + 3, oy + 4, col.e); }
  if (nb.n && nb.e) { rect(ctx, ox + 12, oy, 4, 3, G); rect(ctx, ox + 13, oy, 3, 4, G); px(ctx, ox + 12, oy + 3, col.e); px(ctx, ox + 11, oy + 3, col.e); px(ctx, ox + 12, oy + 4, col.e); }

  if (!nb.n && !nb.w && nb.nw) { rect(ctx, ox, oy, 2, 1, G); px(ctx, ox, oy + 1, G); px(ctx, ox + 1, oy + 1, col.e); }

function waterTile(ctx, ox, oy, tx, ty, nb, t = 0) {

// Silueta con sombreado automático (para árboles, animales…)
function shapeArt(w, h, regions, outline, detail) {
  const [c, x] = mkCanvas(w, h);
  const id = new Int16Array(w * h).fill(-1);
  const inside = (r, X, Y) => {
    if (r.e) { const [cx, cy, rx, ry] = r.e; return ((X - cx) / rx) ** 2 + ((Y - cy) / ry) ** 2 <= 1; }
    if (r.r) { const [x0, y0, x1, y1] = r.r; return X >= x0 && X <= x1 && Y >= y0 && Y <= y1; }
    if (r.p) {
      let ins = false; const P = r.p;
      for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
        if ((P[i][1] > Y) !== (P[j][1] > Y) && X < (P[j][0] - P[i][0]) * (Y - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) ins = !ins;
      }
      return ins;
    }
    return false;
  };
  const center = r => r.e ? [r.e[0], r.e[1], r.e[2], r.e[3]] : r.r ? [(r.r[0] + r.r[2]) / 2, (r.r[1] + r.r[3]) / 2, (r.r[2] - r.r[0]) / 2 + 0.5, (r.r[3] - r.r[1]) / 2 + 0.5]
    : (() => { const xs = r.p.map(p => p[0]), ys = r.p.map(p => p[1]); return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2, (Math.max(...xs) - Math.min(...xs)) / 2 + 0.5, (Math.max(...ys) - Math.min(...ys)) / 2 + 0.5]; })();
  regions.forEach((r, i) => {
    for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) if (inside(r, X + 0.5, Y + 0.5)) id[Y * w + X] = i;
  });
  const at = (X, Y) => (X < 0 || Y < 0 || X >= w || Y >= h ? -1 : id[Y * w + X]);
  for (let Y = 0; Y < h; Y++) for (let X = 0; X < w; X++) {
    const i = at(X, Y);
    if (i < 0) {
      if (outline && (at(X - 1, Y) >= 0 || at(X + 1, Y) >= 0 || at(X, Y - 1) >= 0 || at(X, Y + 1) >= 0)) px(x, X, Y, outline);
      continue;
    }
    const r = regions[i], [cx, cy, rx, ry] = center(r);
    const v = -(((X + 0.5 - cx) / rx) * 0.55 + ((Y + 0.5 - cy) / ry) * 0.85);
    let shade = v > (r.lt ?? 0.42) ? 0 : v > (r.dk ?? -0.38) ? 1 : 2;
    if (r.noise && hash2(X, Y, r.noise) < 0.18) shade = Math.max(0, shade - 1);
    if (r.noise && hash2(X, Y, r.noise + 1) < 0.12) shade = Math.min(2, shade + 1);
    px(x, X, Y, r.c[shade]);
    if (r.inner && (at(X, Y - 1) !== i && at(X, Y - 1) >= 0)) px(x, X, Y, r.inner);
  }
  if (detail) detail(x);
  return c;
}

// Sube de nivel y devuelve los cambios (para mostrarlos)
function gainXp(amount) {
  const p = P();
  const events = [];
  if (p.level >= MAX_LV) return events;
  p.xp += amount;
  while (p.level < MAX_LV && p.xp >= xpFor(p.level + 1)) {
    const before = { maxHp: p.maxHp, atk: p.atk, def: p.def, spd: p.spd };
    p.level++;
    const st = calcStats(PLAYER_BASE, p.level);
    p.hp += st.maxHp - p.maxHp;
    Object.assign(p, st);
    const learned = [];
    for (const m of LEARN[p.level] || []) {
      if (p.moves.find(x => x.id === m)) continue;
      if (p.moves.length < 4) { p.moves.push({ id: m, pp: MOVES[m].pp }); learned.push({ m }); }
      else {
        const i = p.moves.findIndex(x => x.id === 'tajo');
        const idx = i >= 0 ? i : 0;
        const old = p.moves[idx].id;
        p.moves[idx] = { id: m, pp: MOVES[m].pp };
        learned.push({ m, old });
      }
    }
    events.push({ level: p.level, gains: { maxHp: p.maxHp - before.maxHp, atk: p.atk - before.atk, def: p.def - before.def, spd: p.spd - before.spd }, learned });
  }
  if (p.level >= MAX_LV) p.xp = xpFor(MAX_LV);
  return events;
}

// ─── Interfaz: cuadros de texto, menús de elección, paneles ───────────────
class Widget {
  constructor() { this.done = false; this.result = undefined; this.promise = new Promise(r => (this.resolve = r)); }
  update() {}
  draw() {}
}

class TextWidget extends Widget {
  constructor(text, o = {}) {
    super();
    this.o = Object.assign({ x: 0, y: 112, w: 240, h: 48, perPage: 2, auto: 0, hold: false, color: 'dark', style: 'parch', center: false }, o);
    this.lines = Font.wrap(text, this.o.w - 22);
    this.page = 0; this.shown = 0; this.wait = 0; this.t = 0; this.typedDone = false;
    this.typed = new Promise(r => (this.onTyped = r));
  }
  pageLines() { const n = this.o.perPage; return this.lines.slice(this.page * n, this.page * n + n); }
  isLast() { return (this.page + 1) * this.o.perPage >= this.lines.length; }
  update(dt) {
    this.t += dt;
    const total = this.pageLines().join('').length;
    if (this.shown < total) {
      const fast = Input.down('a') || Input.down('b');
      this.shown = Math.min(total, this.shown + dt * (fast ? 0.16 : 0.05));
      if (Input.hit('a') && this.t > 120) this.shown = total;
      if (this.shown >= total) { this.t = 0; if (this.isLast()) { this.typedDone = true; this.onTyped(); } }
      return;
    }
    if (this.isLast()) {
      if (!this.typedDone) { this.typedDone = true; this.onTyped(); }
      if (this.o.hold) return;
      if (this.o.auto) {
        this.wait += dt;
        if (this.wait >= this.o.auto || Input.hit('a') || Input.hit('b')) this.done = true;
        return;
      }
      if (Input.hit('a') || Input.hit('b')) { Sfx.play('blip'); this.done = true; }
    } else if (Input.hit('a') || Input.hit('b')) {
      Sfx.play('blip'); this.page++; this.shown = 0; this.t = 0;
    }
  }
  draw(ctx) {
    const { x, y, w, h, style, color } = this.o;
    if (style !== 'none') drawBox(ctx, x, y, w, h, style);
    let left = Math.floor(this.shown);
    const lines = this.pageLines();
    lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left));
      left -= ln.length;
      const ty = y + 7 + i * Font.LH;
      if (this.o.center) Font.drawCenter(ctx, part, x + w / 2, ty, color);
      else Font.draw(ctx, part, x + 11, ty, color);
    });
    const total = lines.join('').length;
    if (this.shown >= total && !this.o.hold && !this.o.auto && Math.floor(Clock.t / 300) % 2 === 0) {
      drawDownArrow(ctx, x + w - 17, y + h - 12, color === 'light' ? '#f8d458' : '#c23a3a');
    }
  }
}

class ChoiceWidget extends Widget {
  constructor(options, o = {}) {
    super();
    this.opts = options;
    const w = Math.max(...options.map(s => Font.width(s))) + 26;
    const h = options.length * 14 + 12;
    this.o = Object.assign({ w, h, cancel: options.length - 1, idx: 0 }, o);
    if (this.o.x === undefined) this.o.x = 240 - this.o.w - 2;
    if (this.o.y === undefined) this.o.y = 112 - this.o.h - 1;
    this.idx = this.o.idx;
  }
  update() {
    const n = this.opts.length;
    if (Input.repeat('up')) { this.idx = (this.idx + n - 1) % n; Sfx.play('blip'); }
    if (Input.repeat('down')) { this.idx = (this.idx + 1) % n; Sfx.play('blip'); }
    if (Input.hit('a')) { Sfx.play('select'); this.result = this.idx; this.done = true; }
    else if (Input.hit('b') && this.o.cancel !== null) { Sfx.play('back'); this.result = this.o.cancel; this.done = true; }
  }
  draw(ctx) {
    const { x, y, w, h } = this.o;
    drawBox(ctx, x, y, w, h);
    this.opts.forEach((s, i) => {
      const ty = y + 6 + i * 14;
      Font.draw(ctx, s, x + 16, ty, 'dark');
      if (i === this.idx) drawCursor(ctx, x + 8, ty + 3);
    });
  }
}

// Panel libre: draw(ctx) dibuja, step(dt) devuelve un resultado (≠ undefined) para cerrarse
class PanelWidget extends Widget {
  constructor(draw, step) { super(); this.drawFn = draw; this.stepFn = step; }
  update(dt) { const r = this.stepFn ? this.stepFn(dt, this) : ((Input.hit('a') || Input.hit('b')) ? true : undefined); if (r !== undefined) { this.result = r; this.done = true; } }
  draw(ctx) { this.drawFn(ctx, this); }
}

class UI {
  constructor() { this.stack = []; }
  get busy() { return this.stack.length > 0; }
  push(w) { this.stack.push(w); return w.promise; }
  remove(w) { const i = this.stack.indexOf(w); if (i >= 0) this.stack.splice(i, 1); w.resolve(w.result); }
  update(dt) {
    const top = this.stack[this.stack.length - 1];
    if (!top) return;
    top.update(dt);
    if (top.done) { this.stack.splice(this.stack.indexOf(top), 1); top.resolve(top.result); }
  }
  draw(ctx) { for (const w of this.stack) w.draw(ctx); }
  say(text, o) { return this.push(new TextWidget(fmt(text), o)); }
  async sayAll(list, o) { for (const t of list) await this.say(t, o); }
  choose(options, o) { return this.push(new ChoiceWidget(options, o)); }
  async ask(text, options = ['SÍ', 'NO'], o = {}) {
    const tw = new TextWidget(fmt(text), Object.assign({ hold: true }, o.text || {}));
    this.stack.push(tw);
    await tw.typed;
    const r = await this.choose(options, o.choice || {});
    this.remove(tw);
    return r;
  }
  panel(draw, step) { return this.push(new PanelWidget(draw, step)); }
}

const Game = {

  set(scene) { this.scene = scene; if (scene.enter) scene.enter(); },
  update(dt) { if (this.scene) this.scene.update(dt); },
  draw(ctx) {
    if (this.scene) this.scene.draw(ctx);
    if (this.bars > 0) {
      ctx.fillStyle = '#0a0810';
      for (let i = 0; i < 8; i++) {
        const w = Math.round(W * this.bars);
        ctx.fillRect(i % 2 ? W - w : 0, i * 20, w, 20);
      }
    }
    if (this.flashA > 0) { ctx.fillStyle = `rgba(255,255,255,${this.flashA})`; ctx.fillRect(0, 0, W, H); }
    if (this.fadeA > 0) { ctx.fillStyle = `rgba(10,8,16,${this.fadeA})`; ctx.fillRect(0, 0, W, H); }
  },
  fadeOut(ms = 250) { return tween(this, { fadeA: 1 }, ms, Ease.lin); },
  fadeIn(ms = 250) { return tween(this, { fadeA: 0 }, ms, Ease.lin); },
  async battleTransition() {
    Sfx.play('encounter');
    for (let i = 0; i < 3; i++) { this.flashA = 0.85; await tween(this, { flashA: 0 }, 110, Ease.lin); await wait(30); }
    this.bars = 0;
    await tween(this, { bars: 1 }, 420, Ease.in);
    this.fadeA = 1; this.bars = 0;
  },
  async battle(spec) {
    await this.battleTransition();
    const prev = this.scene;
    const b = new BattleScene(spec);
    this.set(b);
    await this.fadeIn(220);
    const res = await b.done;
    await this.fadeOut(320);
    this.set(prev);
    if (!(res === 'lose' && !spec.canLose)) await this.fadeIn(300);
    return res;
  },
  save() { if (this.state) return Save.write(this.state); return false; },
};

// Fondo de combate: cielo, colinas con olivos y dos tarimas de hierba
function battleBg(kind = 'campo') {
  const [c, x] = mkCanvas(W, H);
  const sky = kind === 'aldea' ? ['#a8d8f4', '#bfe2f6', '#d4ecf7', '#e6f4f8'] : ['#9cd2f2', '#b6def5', '#cde9f6', '#e2f2f8'];
  sky.forEach((col, i) => rect(x, 0, i * 12, W, 12, col));
  for (let y = 0; y < 48; y++) for (let X = 0; X < W; X++) {
    if ((X + y) % 2 === 0 && y % 12 === 11) px(x, X, y, sky[Math.min(3, Math.floor(y / 12) + 1)]);
  }
  for (let X = 0; X < W; X++) {
    const h1 = 44 + Math.round(Math.sin(X / 23) * 4 + Math.sin(X / 9) * 1.5);
    rect(x, X, h1, 1, 1, '#b4d890'); rect(x, X, h1 + 1, 1, 60, '#9cc97a');
    const h2 = 52 + Math.round(Math.sin(X / 31 + 2) * 3);
    rect(x, X, h2, 1, 60, '#8ebd6c');
  }
  for (let i = 0; i < 9; i++) {
    const ox = 10 + i * 27 + Math.round(hash2(i, 3, 1) * 8), oy = 46 + Math.round(hash2(i, 4, 1) * 6);
    for (let yy = -4; yy <= 3; yy++) for (let xx = -6; xx <= 6; xx++) if ((xx / 6) ** 2 + (yy / 4) ** 2 <= 1) px(x, ox + xx, oy + yy, yy < -1 ? '#8aae70' : '#76a05e');
    rect(x, ox, oy + 3, 1, 3, '#6a5a48');
  }
  rect(x, 0, 60, W, 52, '#c6e5a0');
  for (let y = 60; y < 112; y += 6) rect(x, 0, y, W, 1, '#bbdd94');
  const plat = (cx, cy, rx, ry) => {
    for (let y = -ry - 2; y <= ry + 2; y++) for (let X = -rx - 2; X <= rx + 2; X++) {
      const d = (X / rx) ** 2 + (y / ry) ** 2;
      if (d <= 1) px(x, cx + X, cy + y, y < -ry * 0.3 ? '#c6eb9e' : '#a8d47c');
      else if ((X / (rx + 2)) ** 2 + (y / (ry + 2)) ** 2 <= 1) px(x, cx + X, cy + y, '#76a84e');
    }
    for (let X = -rx + 6; X < rx - 6; X += 5) px(x, cx + X, cy + Math.round(hash2(X, cy, 2) * ry * 0.6), '#8cc062');
  };
  plat(176, 56, 46, 9);
  plat(70, 122, 60, 14);
  return c;
}

function titleBg() {
  const [c, x] = mkCanvas(W, H);
  const bands = ['#1d1735', '#261d44', '#33245a', '#4a2c66', '#6a366e', '#8e4470', '#b7566c', '#d8705e', '#ec9a5e', '#f6c27a'];
  bands.forEach((col, i) => rect(x, 0, i * 11, W, 11, col));
  rect(x, 0, 110, W, 50, bands[9]);
  for (let i = 0; i < bands.length - 1; i++) for (let X = 0; X < W; X += 2) px(x, X + (i % 2), i * 11 + 10, bands[i + 1]);
  for (let i = 0; i < 70; i++) {
    const sx = Math.floor(hash2(i, 1, 9) * W), sy = Math.floor(hash2(i, 2, 9) * 60);
    px(x, sx, sy, hash2(i, 3, 9) < 0.3 ? '#fff4c8' : '#c8c0e8');
  }
  for (let y = -16; y <= 16; y++) for (let X = -16; X <= 16; X++) if (X * X + y * y <= 256) px(x, 176 + X, 104 + y, y < -6 ? '#fbe08a' : '#f8cf6e');
  for (let X = 0; X < W; X++) {
    const h = 100 + Math.round(Math.sin(X / 37 + 1) * 6 + Math.sin(X / 13) * 2);
    rect(x, X, h, 1, H - h, '#4b2a50');
  }
  // castillo
  const C = '#2b1934';
  const castle = [[34, 70, 14, 34], [48, 80, 40, 24], [88, 66, 14, 38], [60, 74, 14, 10]];
  castle.forEach(([cx, cy, w, h]) => {
    rect(x, cx, cy, w, h, C);
    for (let bx = cx; bx < cx + w; bx += 4) rect(x, bx, cy - 3, 2, 3, C);
  });
  rect(x, 64, 88, 8, 16, '#1a0f22');
  for (const [wx, wy] of [[39, 78], [93, 74], [93, 84], [54, 88], [80, 88]]) rect(x, wx, wy, 2, 4, '#f6c060');
  rect(x, 94, 54, 1, 12, C);
  paintRows(x, ['rrrr', 'rrr.', 'rr..'], { r: '#d83a32' }, 95, 54);
  rect(x, 40, 60, 1, 10, C);
  paintRows(x, ['yyy.', 'yy..'], { y: '#f2c94c' }, 41, 60);
  // primer plano: colina y olivos
  for (let X = 0; X < W; X++) {
    const h = 124 + Math.round(Math.sin(X / 29) * 5 + Math.sin(X / 11 + 3) * 2);
    rect(x, X, h, 1, H - h, '#24152c');
  }
  for (const [ox, oy, s] of [[16, 118, 1], [138, 120, 1.2], [206, 114, 1.1], [226, 122, 0.8]]) {
    for (let yy = -8; yy <= 6; yy++) for (let xx = -12; xx <= 12; xx++) {
      const v = (xx / (11 * s)) ** 2 + (yy / (7 * s)) ** 2 + 0.25 * Math.sin(xx * 1.3) * Math.cos(yy);
      if (v <= 1) px(x, ox + xx, oy + yy, '#24152c');
    }
    rect(x, ox - 1, oy + 5, 3, 10, '#24152c');
  }
  return c;
}

function grid(w, h, f = '.') { return Array.from({ length: h }, () => Array(w).fill(f)); }
function fillG(g, x, y, w, h, c) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < g[0].length) g[j][i] = c;
}
function putG(g, pts, c) { for (const [x, y] of pts) if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
function tallG(g, x, y, w, h) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && g[j][i] === '.') g[j][i] = ',';
}

async function scriptIntroVillage(W) {
  const m = W.npc('madre');
  W.player.dir = 'left';
  await W.wait(400);
  await W.say({ es: '¡{name}! Por fin te veo.', fr: '{name} ! Enfin te voilà.' });
  await W.say({ es: 'Maese Esteban te espera en la palestra, al este de la plaza. ¡Hoy te toma como {esc}!', fr: 'Maître Esteban t\'attend à la palestre, à l\'est de la place. Aujourd\'hui, il te prend comme {esc} !' });
  await W.say({ es: 'Y ya sabes: si te hacen daño, vuelve a casa y te curo.', fr: 'Et tu sais : si tu es blessé{e}, reviens à la maison et je te soignerai.' });
  m.dir = 'right';
  await W.say({ es: '(Cruceta: moverse · A: hablar · B mantenido: correr · MENÚ: abrir el menú)', fr: '(Croix : se déplacer · A : parler · B maintenu : courir · MENU : ouvrir le menu)' }, { color: 'blue' });
  W.flag('introDone', true);
}

async function scriptGuardStop(W) {
  const gd = W.npc('guardia');
  gd.dir = 'right';
  W.player.dir = 'left';
  await W.say({ es: '¡Alto ahí, {name}!', fr: 'Halte-là, {name} !' });
  await W.say(L_.noPermit);
  await W.walk(W.player, 'down', 1);
}

async function scriptEsteban(W) {
  const e = W.npc('esteban');
  if (W.flag('rivalDone')) {
    if (P().hp < P().maxHp) {
      await W.say({ es: 'Ven, que te curo esas heridas.', fr: 'Viens, je vais soigner ces blessures.' });
      W.heal(); Sfx.play('heal');
      await W.say(L_.recoverAll);
    }
    await W.say(L_.firstChallenge);
    return;
  }
  const r = W.npc('rival');
  await W.say({ es: '¡Ah, {name}! Llegas justo a tiempo.', fr: 'Ah, {name} ! Tu arrives juste à temps.' });
  await W.say({ es: 'Llevas años mirando cómo entreno a otros. Hoy por fin te tomo como {esc}.', fr: 'Depuis des années, tu me regardes entraîner les autres. Aujourd\'hui, je te prends enfin comme {esc}.' });
  await W.say({ es: 'Toma. Esta espada es para ti.', fr: 'Tiens. Cette épée est pour toi.' });
  Sfx.play('item');
  await W.say({ es: '{name} recibe una ESPADA CORTA.', fr: '{name} reçoit une ÉPÉE COURTE.' }, { color: 'blue' });
  await W.say({ es: 'Escucha bien. Desde la tregua, las Seis Coronas resuelven sus disputas en los coliseos.', fr: 'Écoute bien. Depuis la trêve, les Six Couronnes règlent leurs querelles dans les colisées.' });
  await W.say({ es: 'Hay ocho. Quien vence a un maestro de coliseo gana su blasón.', fr: 'Il y en a huit. Qui bat un maître de colisée gagne son blason.' });
  await W.say({ es: 'Con los ocho blasones podrás entrar en la Gran Liga de Alta Corona... y te armarán caballero.', fr: 'Avec les huit blasons, tu pourras entrer dans la Grande Ligue de Haute-Couronne... et tu seras adoubé{e} {cab}.' });
  // aparece el rival
  r.dir = 'left';
  W.bubble(r);
  Sfx.play('alert');
  await W.wait(700);
  W.bubble(null);
  await W.say({ es: '{rival}: ¡Padre! ¿Le das una espada a {name} y a mí no?', fr: '{rival} : Père ! Tu donnes une épée à {name} et pas à moi ?' });
  await W.walkNextTo(r, W.player);
  W.faceEachOther(r, W.player);
  await W.say({ es: '{rival}: ¡Yo llevo más tiempo entrenando! {name}, ¡te reto a un duelo!', fr: '{rival} : Ça fait plus longtemps que je m\'entraîne ! {name}, je te défie en duel !' });
  e.dir = W.dirTo(e, W.player);
  await W.say({ es: 'ESTEBAN: Je... Un duelo amistoso. Adelante, que os vea.', fr: 'ESTEBAN : Hé hé... Un duel amical. Allez-y, montrez-moi.' });
  const winText = { es: '¡Ja! ¡Te falta mucho entrenamiento!', fr: 'Ha ! Tu as encore beaucoup à apprendre !' };
  const res = await W.battle({ foe: 'rival', level: 3, name: rivalName().toUpperCase(), look: rivalLook(), trainer: rivalName(), canLose: true, canFlee: false,
    defeatText: { es: '¿Qué? ¡No puede ser!', fr: 'Quoi ? Impossible !' }, winText });
  if (res === 'win') {
    await W.say({ es: '{rival}: Grr... Ha sido suerte. ¡La próxima vez gano yo!', fr: '{rival} : Grr... C\'était de la chance. La prochaine fois, c\'est moi qui gagne !' });
  } else {
    await W.say({ es: '{rival}: ' + winText.es, fr: '{rival} : ' + winText.fr });
    await W.say({ es: 'ESTEBAN: No pasa nada, {name}. Hasta los mejores caballeros cayeron en su primer duelo.', fr: 'ESTEBAN : Ce n\'est rien, {name}. Même les meilleurs chevaliers ont perdu leur premier duel.' });
  }
  await W.say({ es: 'ESTEBAN: Buen combate. Venid, que os curo esos golpes.', fr: 'ESTEBAN : Beau combat. Venez, je vais soigner ces coups.' });
  W.heal(); Sfx.play('heal');
  await W.say(L_.recoverAll);
  await W.say({ es: 'ESTEBAN: Llévate también estas cinco HOGAZAS para el camino.', fr: 'ESTEBAN : Prends aussi ces cinq MICHES pour la route.' });
  W.give('hogaza', 5);
  Sfx.play('item');
  await W.say(t('w_receive', { q: itemQty('hogaza', 5) }), { color: 'blue' });
  await W.say({ es: 'ESTEBAN: Una cosa más. Cuanto más camines en la vida real, más fuerte te harás.', fr: 'ESTEBAN : Encore une chose. Plus tu marcheras dans la vraie vie, plus tu deviendras fort{e}.' });
  await W.say({ es: 'ESTEBAN: Cada kilómetro que andes te dará ducados y objetos. Míralo en CAMINATA, dentro del MENÚ.', fr: 'ESTEBAN : Chaque kilomètre parcouru te rapportera des ducats et des objets. Regarde dans MARCHE, dans le MENU.' });
  if (Pasos.native) await W.activateSteps();
  await W.say({ es: 'ESTEBAN: Y ahora, al norte por la Ruta 1. El coliseo de Toledo es tu primer reto.', fr: 'ESTEBAN : Et maintenant, cap au nord par la Route 1. Le colisée de Tolède est ton premier défi.' });
  await W.say({ es: '{rival}: ¡Nos vemos en Toledo, {name}! ¡Allí te ganaré yo!', fr: '{rival} : On se retrouve à Tolède, {name} ! Là-bas, c\'est moi qui gagnerai !' });
  await W.walkTo(r, 16, 12);
  r.dir = 'left';
  await W.walk(r, 'left', 1);
  await W.fadeNpc(r);
  W.flag('rivalDone', true);
  W.flag('canLeave', true);
  Game.save();
}

async function trainerMartin(W, n) {
  n.dir = W.dirTo(n, W.player);
  W.player.dir = W.dirTo(W.player, n);
  await W.say({ es: 'MARTÍN: ¡Eh, tú! Tienes pinta de {esc} novat{o}. ¡En guardia!', fr: 'MARTIN : Hé, toi ! Tu as l\'air d\'un{e} {esc} débutant{e}. En garde !' });
  const res = await W.battle({ foe: 'martin', level: 4, look: 'martin', trainer: { es: 'Martín', fr: 'Martin' }, canLose: false, canFlee: false,
    defeatText: { es: '¡Vaya brazo tienes!', fr: 'Quel bras tu as !' }, winText: { es: 'Vuelve cuando hayas entrenado más.', fr: 'Reviens quand tu te seras mieux entraîné{e}.' } });
  if (res === 'win') {
    W.flag('beatMartin', true);
    await W.say({ es: 'MARTÍN: Sigue así y llegarás lejos.', fr: 'MARTIN : Continue comme ça et tu iras loin.' });
  }
  return res;
}

// ── 10-world.js ──
// ─── Mundo: mapa, movimiento por casillas, personajes y menú ─────────────
const BLOCK = 'TCFR~';
const WALK_MS = 240;

function renderMap(def, g) {
  const mw = g[0].length, mh = g.length;
  const [c, x] = mkCanvas(mw * T, mh * T);
  const at = (i, j) => (i < 0 || j < 0 || i >= mw || j >= mh ? null : g[j][i]);
  for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) {
    const ch = g[j][i], ox = i * T, oy = j * T;
    if (DIRT(ch)) {
      const nb = {};
      for (const [k, dx, dy] of [['n', 0, -1], ['s', 0, 1], ['w', -1, 0], ['e', 1, 0], ['nw', -1, -1], ['ne', 1, -1], ['sw', -1, 1], ['se', 1, 1]]) {
        const v = at(i + dx, j + dy);
        nb[k] = v !== null && !DIRT(v);
      }
      dirtTile(x, ox, oy, i, j, nb, ch === 's' ? PAL.sand : PAL.dirt);
    } else if (ch === '~') {
      const nb = {};
      for (const [k, dx, dy] of [['n', 0, -1], ['s', 0, 1], ['w', -1, 0], ['e', 1, 0]]) { const v = at(i + dx, j + dy); nb[k] = v !== null && v !== '~'; }
      waterTile(x, ox, oy, i, j, nb);
    } else if (ch === ',') tallGrass(x, ox, oy);
    else if (ch === '*') flowers(x, ox, oy, i, j);
    else grassBase(x, ox, oy, i, j);
  }
  for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) {
    const ch = g[j][i];
    if (ch === 'F') drawFence(x, i * T, j * T, { n: at(i, j - 1) === 'F', s: at(i, j + 1) === 'F', w: at(i - 1, j) === 'F', e: at(i + 1, j) === 'F' });
    if (ch === 'R') drawRock(x, i * T, j * T);
  }
  for (let j = 0; j < mh; j++) for (let i = 0; i < mw; i++) {
    const ch = g[j][i];
    if (ch === 'T' && i % 2 === 0 && j % 2 === 0) drawOlive(x, i * T, j * T, i * 7 + j * 13);
    if (ch === 'C' && at(i, j - 1) !== 'C') drawCypress(x, i * T, j * T);
  }
  for (const o of def.objects || []) {
    const ox = o.x * T, oy = o.y * T;
    if (o.type === 'house') drawHouse(x, ox, oy, o.w, o.h, o.o);
    else if (o.type === 'well') drawWell(x, ox, oy);
    else if (o.type === 'sign') drawSign(x, ox, oy);
    else if (o.type === 'dummy') drawDummy(x, ox, oy);
    else if (o.type === 'barrel') drawBarrel(x, ox, oy);
    else if (o.type === 'barricade') drawBarricade(x, ox, oy);
  }
  return c;
}

class Ent {
  constructor(def) {
    this.def = def; this.id = def.id;
    this.x = def.x; this.y = def.y; this.dir = def.dir || 'down';
    this.px = this.x * T; this.py = this.y * T;
    this.moving = false; this.mt = 0; this.step = 0; this.speed = 1;
    this.home = { x: def.x, y: def.y }; this.wt = 1000 + Math.random() * 2000; this.alpha = 1;
  }
  get look() { return typeof this.def.look === 'function' ? this.def.look() : this.def.look; }
  frame() {
    const b = DIR_ROW[this.dir];
    if (this.moving && this.mt < 0.5) return b + (this.step % 2 ? 1 : 2);
    return b;
  }
}

class WorldScene {
  constructor() {
    this.ui = new UI(); this.busy = false; this.ents = []; this.cam = { x: 0, y: 0 };
    this.banner = { y: -30, text: '' }; this.cache = {}; this.turnT = 0; this.bumpT = 0; this.bubbleEnt = null; this.lastTall = false;
  }

  // ── carga del mapa ──
  load(mapId, x, y, dir) {
    const def = MAPS[mapId];
    this.def = def; this.mapId = mapId;
    if (!this.cache[mapId]) { const g = def.build(); this.cache[mapId] = { g, canvas: renderMap(def, g) }; }
    this.grid = this.cache[mapId].g; this.canvas = this.cache[mapId].canvas;
    this.mw = this.grid[0].length; this.mh = this.grid.length;
    this.objs = {};
    for (const o of def.objects || []) {
      const w = o.w || 1, h = o.h || 1;
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.objs[(o.x + i) + ',' + (o.y + j)] = o;
    }
    this.player = new Ent({ id: 'player', look: () => playerLook(), x, y, dir });
    this.ents = [this.player];
    for (const n of def.npcs || []) if (!n.cond || n.cond()) this.ents.push(new Ent(n));
    this.items = (def.items || []).filter(it => !S0().flags['item_' + it.id]);
    const s = S0(); s.map = mapId; s.x = x; s.y = y; s.dir = dir;
    this.showBanner(def.name);
    if (Pasos.native) Pasos.onResume();
    this.snapCam();
  }
  showBanner(name) {
    const text = tr(name);
    this.banner.text = text; this.banner.y = -30;
    tween(this.banner, { y: 4 }, 250).then(() => wait(1700)).then(() => { if (this.banner.text === text) tween(this.banner, { y: -30 }, 250); });
  }
  snapCam() {
    const p = this.player;
    this.cam.x = clamp(p.px + 8 - W / 2, 0, Math.max(0, this.mw * T - W));
    this.cam.y = clamp(p.py + 8 - H / 2, 0, Math.max(0, this.mh * T - H));
  }

  // ── consultas ──
  tile(x, y) { return x < 0 || y < 0 || x >= this.mw || y >= this.mh ? null : this.grid[y][x]; }
  objAt(x, y) { return this.objs[x + ',' + y]; }
  itemAt(x, y) { return this.items.find(i => i.x === x && i.y === y); }
  entAt(x, y, ignore) {
    return this.ents.find(e => e !== ignore && !e.gone && ((e.x === x && e.y === y) || (e.moving && e.tx === x && e.ty === y)));
  }
  blocked(x, y, ignore) {
    const c = this.tile(x, y);
    if (c === null || BLOCK.includes(c)) return true;
    if (this.objAt(x, y) || this.itemAt(x, y)) return true;
    return !!this.entAt(x, y, ignore);
  }
  npc(id) { return this.ents.find(e => e.id === id); }
  flag(k, v) { const f = S0().flags; if (v === undefined) return !!f[k]; f[k] = v; return v; }

  // ── movimiento ──
  move(e, dir, speed = 1) {
    const [dx, dy] = DV[dir];
    e.dir = dir; e.tx = e.x + dx; e.ty = e.y + dy; e.moving = true; e.mt = 0; e.speed = speed;
    return new Promise(r => (e.arrive = r));
  }
  updateEnt(e, dt) {
    if (!e.moving) return;
    e.mt += dt * e.speed / WALK_MS;
    const k = Math.min(1, e.mt);
    e.px = (e.x + (e.tx - e.x) * k) * T; e.py = (e.y + (e.ty - e.y) * k) * T;
    if (e.mt >= 1) {
      e.x = e.tx; e.y = e.ty; e.px = e.x * T; e.py = e.y * T; e.moving = false; e.step++;
      if (e === this.player) this.onStep();
      const a = e.arrive; e.arrive = null; if (a) a();
    }
  }

  // ── bucle ──
  update(dt) {
    this.ui.update(dt);
    for (const e of this.ents) this.updateEnt(e, dt);
    if (!this.busy && !this.ui.busy) this.updatePlayer(dt);
    if (!this.busy && !this.ui.busy) for (const e of this.ents) if (e.def.wander) this.wander(e, dt);
    if (Pasos.native) {
      this.syncT = (this.syncT || 0) + dt;
      if (this.syncT > 60000) { this.syncT = 0; Pasos.onResume(); }
      if (Pasos.pending && !this.busy && !this.ui.busy && !this.player.moving) {
        const res = Pasos.pending; Pasos.pending = null;
        this.runScript(W => W.showWalkResult(res));
      }
    }
    if (this.bumpT > 0) this.bumpT -= dt;
    const p = this.player;
    const tx = clamp(p.px + 8 - W / 2, 0, Math.max(0, this.mw * T - W));
    const ty = clamp(p.py + 8 - H / 2, 0, Math.max(0, this.mh * T - H));
    this.cam.x = tx; this.cam.y = ty;
  }
  updatePlayer(dt) {
    const p = this.player;
    if (p.moving) return;
    if (Input.hit('start')) { this.runScript(W => W.openMenu()); return; }
    if (Input.hit('a')) { this.interact(); return; }
    const d = Input.dir();
    if (!d) { this.turnT = 0; return; }
    if (d !== p.dir) { p.dir = d; this.turnT = 70; return; }
    if (this.turnT > 0) { this.turnT -= dt; return; }
    const [dx, dy] = DV[d];
    const nx = p.x + dx, ny = p.y + dy;
    if (nx < 0 || ny < 0 || nx >= this.mw || ny >= this.mh) {
      const c = this.def.conn && this.def.conn[d];
      if (c) this.runScript(W => W.changeMap(c, d));
      else this.bump();
      return;
    }
    if (this.blocked(nx, ny, p)) { this.bump(); return; }
    this.move(p, d, Input.down('b') ? 2 : 1);
  }
  bump() { if (this.bumpT <= 0) { Sfx.play('bump'); this.bumpT = 320; } }

  wander(e, dt) {
    if (e.moving) return;
    e.wt -= dt;
    if (e.wt > 0) return;
    e.wt = 1400 + Math.random() * 2600;
    const d = pick(DIRS);
    const [dx, dy] = DV[d];
    const nx = e.x + dx, ny = e.y + dy, r = e.def.wander;
    if (Math.abs(nx - e.home.x) > r || Math.abs(ny - e.home.y) > r) { e.dir = d; return; }
    if (this.blocked(nx, ny, e) || this.tile(nx, ny) === ',') { e.dir = d; return; }
    this.move(e, d, 1);
  }

  onStep() {
    const p = this.player, s = S0();
    s.x = p.x; s.y = p.y; s.dir = p.dir; s.steps++;
    for (const tr of this.def.triggers || []) {
      if (tr.x === p.x && tr.y === p.y && (!tr.cond || tr.cond())) { this.runScript(tr.run); return; }
    }
    if (this.checkTrainers()) return;
    if (this.tile(p.x, p.y) === ',' && this.def.wild && Math.random() < 0.1) this.runScript(W => W.wildBattle());
  }

  checkTrainers() {
    const p = this.player;
    for (const e of this.ents) {
      const tr = e.def.trainer;
      if (!tr || this.flag(tr.flag) || e.gone) continue;
      const [dx, dy] = DV[e.dir];
      for (let i = 1; i <= tr.range; i++) {
        const x = e.x + dx * i, y = e.y + dy * i;
        if (p.x === x && p.y === y) {
          this.runScript(async W => {
            W.bubble(e); Sfx.play('alert');
            await W.wait(800); W.bubble(null);
            await W.walkNextTo(e, p);
            await e.def.talk(W, e);
          });
          return true;
        }
        const c = this.tile(x, y);
        if (c === null || BLOCK.includes(c) || this.objAt(x, y) || this.entAt(x, y, p)) break;
      }
    }
    return false;
  }

  interact() {
    const p = this.player;
    const [dx, dy] = DV[p.dir];
    const x = p.x + dx, y = p.y + dy;
    const e = this.ents.find(n => n !== p && !n.gone && n.x === x && n.y === y && !n.moving);
    if (e) {
      this.runScript(async W => {
        e.dir = OPP[p.dir];
        if (e.def.talk) await e.def.talk(W, e);
        else if (e.def.text) await W.say(e.def.text);
      });
      return;
    }
    const it = this.itemAt(x, y);
    if (it) {
      this.runScript(async W => {
        W.items = W.items.filter(i => i !== it);
        W.flag('item_' + it.id, true);
        W.give(it.item, it.n);
        Sfx.play('item');
        await W.say(t('w_found', { q: itemQty(it.item, it.n) }), { color: 'blue' });
      });
      return;
    }
    const o = this.objAt(x, y);
    if (o) {
      let text = null;
      if (o.type === 'house') { if (x === o.x + o.o.door && y === o.y + o.h - 1) text = o.door; }
      else text = typeof o.text === 'function' ? o.text() : o.text;
      if (text) this.runScript(async W => { await W.say(text); });
    }
  }

  async runScript(fn) {
    if (this.busy) return;
    this.busy = true;
    try { await fn(this); } catch (err) { console.error(err); }
    this.busy = false;
  }

  // ── API para guiones ──
  say(t, o) { return this.ui.say(t, o); }
  ask(t, opts, o) { return this.ui.ask(t, opts, o); }
  wait(ms) { return wait(ms); }
  bubble(e) { this.bubbleEnt = e; }
  heal() { healPlayer(); }
  give(item, n = 1) { const it = S0().items; it[item] = (it[item] || 0) + n; }
  dirTo(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
  faceEachOther(a, b) { a.dir = this.dirTo(a, b); b.dir = this.dirTo(b, a); }
  async walk(e, dir, n = 1) {
    for (let i = 0; i < n; i++) {
      const [dx, dy] = DV[dir];
      if (this.blocked(e.x + dx, e.y + dy, e)) { e.dir = dir; return; }
      await this.move(e, dir, 1);
    }
  }
  path(e, tx, ty) {
    const key = (x, y) => x + ',' + y;
    const prev = new Map([[key(e.x, e.y), null]]);
    const q = [[e.x, e.y]];
    while (q.length) {
      const [x, y] = q.shift();
      if (x === tx && y === ty) break;
      for (const d of DIRS) {
        const [dx, dy] = DV[d], nx = x + dx, ny = y + dy, k = key(nx, ny);
        if (prev.has(k)) continue;
        if (!(nx === tx && ny === ty) && this.blocked(nx, ny, e)) continue;
        if (nx === tx && ny === ty && this.blocked(nx, ny, e)) continue;
        prev.set(k, [x, y, d]); q.push([nx, ny]);
      }
    }
    if (!prev.has(key(tx, ty))) return null;
    const dirs = [];
    let cur = key(tx, ty);
    while (prev.get(cur)) { const [px2, py2, d] = prev.get(cur); dirs.unshift(d); cur = key(px2, py2); }
    return dirs;
  }
  async walkTo(e, tx, ty) {
    const dirs = this.path(e, tx, ty);
    if (!dirs) return;
    for (const d of dirs) await this.move(e, d, 1);
  }
  async walkNextTo(e, target) {
    let best = null;
    for (const d of DIRS) {
      const [dx, dy] = DV[d], x = target.x + dx, y = target.y + dy;
      if (x === e.x && y === e.y) return;
      if (this.blocked(x, y, e)) continue;
      const dirs = this.path(e, x, y);
      if (dirs && (!best || dirs.length < best.length)) best = dirs;
    }
    if (best) for (const d of best) await this.move(e, d, 1);
  }
  async fadeNpc(e) { await tween(e, { alpha: 0 }, 300, Ease.lin); e.gone = true; }
  async changeMap(c, d) {
    await Game.fadeOut(220);
    const p = this.player;
    let nx = p.x + (c.dx || 0), ny = p.y + (c.dy || 0);
    const target = MAPS[c.map];
    if (!this.cache[c.map]) { const g = target.build(); this.cache[c.map] = { g, canvas: renderMap(target, g) }; }
    const g = this.cache[c.map].g;
    if (d === 'up') ny = g.length - 1;
    if (d === 'down') ny = 0;
    if (d === 'left') nx = g[0].length - 1;
    if (d === 'right') nx = 0;
    this.load(c.map, nx, ny, d);
    Game.save();
    await Game.fadeIn(220);
  }
  async battle(spec) {
    const res = await Game.battle(spec);
    if (res === 'lose' && !spec.canLose) await this.onLose();
    else Game.save();
    return res;
  }
  async wildBattle() {
    const table = this.def.wild;
    if (!table || !table.length) return;
    let r = Math.random() * table.reduce((a, b) => a + b.w, 0);
    let pickE = table[0];
    for (const t of table) { if ((r -= t.w) < 0) { pickE = t; break; } }
    await this.battle({ foe: pickE.id, level: randInt(pickE.lv[0], pickE.lv[1]), canFlee: true, canLose: false });
  }
  async onLose() {
    const s = S0();
    s.ducados = Math.floor(s.ducados / 2);
    healPlayer();
    this.load('villaolivo', 5, 17, 'down');
    Game.fadeA = 1;
    await Game.fadeIn(500);
    const m = this.npc('madre');
    if (m) { m.dir = 'right'; this.player.dir = 'left'; }
    await this.say(t('w_wake'));
    await this.say(t('w_lostGold'));
    Game.save();
  }

  // ── dibujo ──
  draw(ctx) {
    rect(ctx, 0, 0, W, H, '#0a0810');
    const cx = Math.round(this.cam.x), cy = Math.round(this.cam.y);
    ctx.drawImage(this.canvas, -cx, -cy);
    for (const it of this.items) drawSack(ctx, it.x * T - cx, it.y * T - cy);
    const list = this.ents.filter(e => !e.gone).sort((a, b) => a.py - b.py || (a === this.player ? 1 : -1));
    for (const e of list) {
      ctx.globalAlpha = e.alpha;
      drawChar(ctx, e.look, e.frame(), e.px - cx, e.py - 8 - cy);
      ctx.globalAlpha = 1;
      const gx = Math.round(e.px / T), gy = Math.round(e.py / T);
      if (this.tile(gx, gy) === ',') tallGrass(ctx, gx * T - cx, gy * T - cy, true);
    }
    if (this.bubbleEnt) drawBubble(ctx, this.bubbleEnt.px - cx + 4, this.bubbleEnt.py - cy - 22);
    if (this.banner.y > -30) {
      const bw = Font.width(this.banner.text) + 24;
      drawBox(ctx, 4, Math.round(this.banner.y), bw, 22);
      Font.draw(ctx, this.banner.text, 16, Math.round(this.banner.y) + 4, 'dark');
    }
    this.ui.draw(ctx);
  }

  // ── menú de pausa ──
  async openMenu() {
    Sfx.play('select');
    let idx = 0;
    for (;;) {
      const opts = [t('m_status'), t('m_items'), t('m_walk'), t('m_save'), Sfx.on ? t('m_soundOn') : t('m_soundOff'), t('m_lang'), t('m_close')];
      const r = await this.ui.choose(opts, { y: 4, idx, cancel: 6 });
      idx = r;
      if (r === 0) await this.statusScreen();
      else if (r === 1) await this.itemsScreen();
      else if (r === 2) await this.walkScreen();
      else if (r === 3) { if (await this.saveGame()) break; }
      else if (r === 4) { Sfx.on = !Sfx.on; Sfx.play('select'); }
      else if (r === 5) {
        const l = await this.ui.choose(['ESPAÑOL', 'FRANÇAIS'], { y: 4, idx: Lang.cur === 'fr' ? 1 : 0, cancel: null });
        Lang.set(l === 1 ? 'fr' : 'es');
        this.showBanner(this.def.name);
      }
      else break;
    }
  }

  statusScreen() {
    return this.ui.panel(ctx => drawStatus(ctx));
  }

  async itemsScreen() {
    for (;;) {
      const it = S0().items;
      const ids = Object.keys(ITEMS).filter(k => (it[k] || 0) > 0);
      if (!ids.length) { await this.say(t('b_noItems')); return; }
      const opts = ids.map(k => `${tr(ITEMS[k].name)} ×${it[k]}`).concat([t('back')]);
      const r = await this.ui.choose(opts, { y: 4, cancel: opts.length - 1 });
      if (r === opts.length - 1) return;
      const id = ids[r];
      const ans = await this.ask(t('w_useQ', { t: tr(ITEMS[id].txt) }), [t('use'), t('no')]);
      if (ans !== 0) continue;
      const p = P();
      if (p.hp >= p.maxHp) { await this.say(t('b_fullHp')); continue; }
      const before = p.hp;
      p.hp = Math.min(p.maxHp, p.hp + ITEMS[id].heal);
      it[id]--;
      Sfx.play('heal');
      await this.say(t('w_recovered', { v: p.hp - before }));
    }
  }

  walkScreen() {
    const st = { msg: '', t: 0, busy: false };
    if (Pasos.native) Pasos.refreshState();
    return this.ui.panel(ctx => drawWalk(ctx, st), (dt) => {
      st.t += dt;
      if (st.busy) return undefined;
      if (Input.hit('a')) {
        if (!Pasos.native) {
          S0().km += 1;
          st.msg = claimWalkRewards(); st.t = 0;
          Sfx.play('coin');
        } else if (Pasos.available) {
          st.busy = true;
          (async () => {
            if (!Pasos.granted) await Pasos.askPermission();
            if (Pasos.granted) {
              const res = await Pasos.sync();
              if (res && res.first) st.msg = t('k_on');
              else if (res && res.km > 0) { st.msg = '+' + kmFmt(res.km) + ' km' + (res.rewards ? ' · ' + res.rewards : ''); Sfx.play('coin'); }
              else st.msg = '+0,0 km';
              st.t = 0;
            }
            st.busy = false;
          })();
        }
      }
      if (Input.hit('b')) { Sfx.play('back'); return true; }
      return undefined;
    });
  }

  async activateSteps() {
    await Pasos.refreshState();
    if (!Pasos.available) { await this.say(t('k_noSensor1') + ' ' + t('k_noSensor2')); return; }
    if (!Pasos.granted) await Pasos.askPermission();
    if (!Pasos.granted) { await this.say(t('k_denied')); return; }
    await Pasos.sync();
    Sfx.play('item');
    await this.say(t('k_ready'), { color: 'blue' });
  }

  async showWalkResult(res) {
    if (res.first) { await this.say(t('k_ready'), { color: 'blue' }); return; }
    if (res.km >= 0.05) {
      Sfx.play('coin');
      await this.say(t('k_reward', { v: kmFmt(res.km) }));
      if (res.rewards) await this.say(res.rewards, { color: 'blue' });
    }
    if (res.capped) await this.say(t('k_cap', { v: WALK.maxKmPerDay }));
  }

  async saveGame() {
    const r = await this.ask(t('w_saveQ'), [t('yes'), t('no')]);
    if (r !== 0) return false;
    const ok = Game.save();
    Sfx.play(ok ? 'item' : 'bump');
    await this.say(ok ? t('w_saved') : t('w_saveFail'));
    return ok;
  }
}
